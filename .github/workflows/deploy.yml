# Builds and checks the site on every pull request, and publishes it to GitHub Pages on every push to main.
# In the repo settings, set Pages > Source to "GitHub Actions".
name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild catalog (fails if a syllabus topic or prerequisite link breaks)
        run: python3 build_catalog.py .
      - name: Run every code example in the lessons and check its output
        run: python3 tools/check_code.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - name: Build site
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # A <username>.github.io repo is served at the root; any other repo name at /<repo>.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    # Pull requests only build and check; merging to main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<text x="500.0" y="193.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Collection: help_centre</text>
<text x="500.0" y="213.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">vector size 384, distance Cosine</text><text x="500.0" y="228.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">HNSW m=16, payload indexes</text>
<rect x="700" y="130" width="345" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="872.5" y="178.0" font-size="28" text-anchor="middle">📜</text>
<text x="872.5" y="201.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Write-ahead log</text>
<text x="872.5" y="221.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every upsert lands here first</text>
<rect x="335" y="270" width="330" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="500.0" y="315.0" font-size="28" text-anchor="middle">🧩</text>

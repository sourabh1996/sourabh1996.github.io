<text x="500.0" y="358.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">segments: vectors + HNSW</text><text x="500.0" y="373.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ payload index</text>
<rect x="700" y="270" width="345" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="872.5" y="315.0" font-size="28" text-anchor="middle">🧩</text>
<text x="872.5" y="338.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Shard 2 (+ replica)</text>
<text x="872.5" y="358.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">segments: vectors + HNSW</text><text x="872.5" y="373.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ payload index</text>
<rect x="335" y="420" width="710" height="120" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="690.0" y="465.0" font-size="28" text-anchor="middle">📍</text>
<text x="690.0" y="488.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">A point</text>
<text x="690.0" y="508.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">id: 7c9e...-uuid   vector: [0.98, 0.0, 0.19, ...]</text><text x="690.0" y="523.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">payload: {&quot;topic&quot;: &quot;payments&quot;, &quot;lang&quot;: &quot;en&quot;, &quot;text&quot;: &quot;UPI payment failed...&quot;}</text>
<text x="550" y="610.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">A query fans out to every shard, filters on the payload while walking HNSW, and merges the top k.</text>
<text x="550" y="640.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Scores come back as similarities for Cosine and Dot: higher is better.</text>
</svg>
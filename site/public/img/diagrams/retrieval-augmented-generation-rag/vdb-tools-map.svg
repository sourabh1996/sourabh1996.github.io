<rect x="1" y="1" width="1098" height="658" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#1f766d"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">The vector tools in this module</text>

<rect x="30" y="255" width="110" height="130" rx="10" fill="#1f766d"/>
<text x="85.0" y="328.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Dedicated</text>
<rect x="20" y="410" width="1060" height="150" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="420" width="110" height="130" rx="10" fill="#5b3fa0"/>
<text x="85.0" y="493.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Built-in</text>
<rect x="200" y="100" width="400" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="400.0" y="140.0" font-size="28" text-anchor="middle">⚡</text>
<text x="400.0" y="163.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">FAISS</text>
<text x="400.0" y="183.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">index types you assemble yourself</text><text x="400.0" y="198.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in your process, no server</text>
<rect x="640" y="100" width="420" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="850.0" y="144.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Use for</text>
<text x="850.0" y="164.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">batch jobs, research, huge offline indexes,</text><text x="850.0" y="179.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the engine inside your own service</text>
<rect x="200" y="265" width="200" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="300.0" y="305.0" font-size="28" text-anchor="middle">🧪</text>
<text x="300.0" y="328.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Chroma</text>
<text x="300.0" y="348.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">embedded or server</text><text x="300.0" y="363.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">embeds text for you</text>
<rect x="420" y="265" width="200" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="520.0" y="305.0" font-size="28" text-anchor="middle">🗂️</text>
<text x="520.0" y="328.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">LanceDB</text>
<text x="520.0" y="348.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">tables in files</text><text x="520.0" y="363.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">versioned, columnar</text>
<rect x="640" y="265" width="200" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="740.0" y="305.0" font-size="28" text-anchor="middle">🎯</text>
<text x="740.0" y="328.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Qdrant</text>
<text x="740.0" y="348.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">server or local mode</text><text x="740.0" y="363.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">rich payload filters</text>
<rect x="860" y="265" width="200" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="960.0" y="305.0" font-size="28" text-anchor="middle">☁️</text>
<text x="960.0" y="328.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Pinecone</text>
<text x="960.0" y="348.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">managed only</text><text x="960.0" y="363.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">serverless, namespaces</text>
<rect x="200" y="430" width="400" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="400.0" y="470.0" font-size="28" text-anchor="middle">🍃</text>
<text x="400.0" y="493.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">MongoDB</text>
<text x="400.0" y="513.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">$vectorSearch stage in an</text><text x="400.0" y="528.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">aggregation pipeline</text>
<rect x="640" y="430" width="420" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="850.0" y="470.0" font-size="28" text-anchor="middle">💠</text>
<text x="850.0" y="493.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Cassandra 5</text>
<text x="850.0" y="513.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">VECTOR column + SAI index</text><text x="850.0" y="528.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">ORDER BY ... ANN OF in CQL</text>
<text x="550" y="598.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Same idea everywhere: store id + vector + metadata, then ask for the k nearest with a filter.</text>
<text x="550" y="626.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">What differs: who runs it, how filters are written, and how scores are reported.</text>
</svg>
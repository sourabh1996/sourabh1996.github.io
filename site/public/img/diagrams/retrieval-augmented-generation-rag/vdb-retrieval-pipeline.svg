<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="An embedding-based retrieval pipeline">

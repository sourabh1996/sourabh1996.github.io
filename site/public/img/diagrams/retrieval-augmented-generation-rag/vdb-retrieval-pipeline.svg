<path d="M610.0,435.0 L625.0,375.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M690.0,502.5 L710.0,502.5" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M880.0,502.5 L900.0,502.5" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="180" y="100" width="150" height="135" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="255.0" y="152.5" font-size="28" text-anchor="middle">📄</text>
<text x="255.0" y="175.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Sources</text>
<text x="255.0" y="195.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">docs, tickets,</text><text x="255.0" y="211.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">web pages</text>
<rect x="350" y="100" width="160" height="135" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="430.0" y="152.5" font-size="28" text-anchor="middle">✂️</text>
<text x="430.0" y="175.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Clean + chunk</text>
<text x="430.0" y="195.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">ids: doc#n</text><text x="430.0" y="211.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">content hash</text>
<rect x="530" y="100" width="160" height="135" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="610.0" y="152.5" font-size="28" text-anchor="middle">🔁</text>
<text x="610.0" y="175.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Diff</text>
<text x="610.0" y="195.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">new, changed,</text><text x="610.0" y="211.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">unchanged, gone</text>
<rect x="710" y="100" width="170" height="135" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="795.0" y="152.5" font-size="28" text-anchor="middle">🧮</text>
<text x="795.0" y="175.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Embed</text>
<text x="795.0" y="195.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">batches, retries,</text><text x="795.0" y="211.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cache by hash</text>
<rect x="900" y="100" width="170" height="135" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="985.0" y="152.5" font-size="28" text-anchor="middle">⬆️</text>
<text x="985.0" y="175.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Upsert + delete</text>
<text x="985.0" y="195.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">vector, text,</text><text x="985.0" y="211.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">metadata</text>
<rect x="180" y="295" width="890" height="80" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="625.0" y="328.0" font-size="28" text-anchor="middle">🗄️</text>
<text x="625.0" y="351.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Vector store: help_centre__model-v2</text>
<text x="625.0" y="371.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">any tool from this module: Chroma, FAISS, Qdrant, Pinecone, LanceDB, MongoDB, Cassandra</text>
<rect x="180" y="435" width="150" height="135" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="255.0" y="487.5" font-size="28" text-anchor="middle">❓</text>
<text x="255.0" y="510.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Question</text>
<text x="255.0" y="530.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ user, tenant,</text><text x="255.0" y="546.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">language</text>
<rect x="350" y="435" width="160" height="135" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="430.0" y="487.5" font-size="28" text-anchor="middle">🧮</text>
<text x="430.0" y="510.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Embed query</text>
<text x="430.0" y="530.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">same model</text><text x="430.0" y="546.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">as ingest</text>
<rect x="530" y="435" width="160" height="135" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="610.0" y="487.5" font-size="28" text-anchor="middle">🔎</text>
<text x="610.0" y="510.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Search</text>
<text x="610.0" y="530.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">top k with</text><text x="610.0" y="546.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">filters</text>
<rect x="710" y="435" width="170" height="135" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="795.0" y="487.5" font-size="28" text-anchor="middle">🧹</text>
<text x="795.0" y="510.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Post-process</text>
<text x="795.0" y="530.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">threshold, dedupe,</text><text x="795.0" y="546.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">rerank</text>
<rect x="900" y="435" width="170" height="135" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="985.0" y="487.5" font-size="28" text-anchor="middle">📋</text>
<text x="985.0" y="510.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Context</text>
<text x="985.0" y="530.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">chunks with</text><text x="985.0" y="546.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">citations</text>
<text x="550" y="630.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Ingest runs when content changes; query runs on every request. Both must use the same embedding model.</text>
<text x="550" y="660.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Version the store by model, measure recall@k on real questions, and keep deletes in sync with the sources.</text>
</svg>
<rect x="30" y="425" width="110" height="155" rx="10" fill="#2e7d4f"/>
<text x="85.0" y="510.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Query</text>
<path d="M330.0,167.5 L350.0,167.5" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M510.0,167.5 L530.0,167.5" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

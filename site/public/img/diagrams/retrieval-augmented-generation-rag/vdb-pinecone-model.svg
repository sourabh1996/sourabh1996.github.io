<text x="310.0" y="163.0" font-size="28" text-anchor="middle">🔑</text>
<text x="310.0" y="186.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Project + API key</text>
<text x="310.0" y="206.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">PINECONE_API_KEY in your environment</text>
<rect x="55" y="235" width="510" height="95" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="310.0" y="267.5" font-size="28" text-anchor="middle">📚</text>
<text x="310.0" y="290.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Index: help-centre</text>
<text x="310.0" y="310.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">schema: dense vector (dim, metric) + text fields</text><text x="310.0" y="326.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cloud + region, its own host URL</text>
<rect x="55" y="355" width="160" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="135.0" y="394.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">acme</text>
<text x="135.0" y="414.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">namespace</text>
<rect x="230" y="355" width="160" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="310.0" y="394.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">zomato</text>
<text x="310.0" y="414.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">namespace</text>
<rect x="405" y="355" width="160" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="485.0" y="394.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">__default__</text>
<text x="485.0" y="414.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">namespace</text>
<rect x="55" y="460" width="510" height="85" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="310.0" y="495.5" font-size="28" text-anchor="middle">📄</text>
<text x="310.0" y="518.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Document</text>
<text x="310.0" y="538.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">_id, embedding, text, topic, lang ... (40 KB metadata)</text>
<rect x="645" y="130" width="400" height="80" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="163.0" font-size="28" text-anchor="middle">🌐</text>
<text x="845.0" y="186.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">API endpoint per index</text>
<text x="845.0" y="206.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">upsert, search, fetch, update, delete</text>
<rect x="645" y="235" width="400" height="95" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="845.0" y="275.5" font-size="28" text-anchor="middle">⚙️</text>
<text x="845.0" y="298.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Query compute</text>
<text x="845.0" y="318.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">scales with traffic, caches hot data</text>
<rect x="645" y="355" width="400" height="85" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="845.0" y="390.5" font-size="28" text-anchor="middle">🪣</text>
<text x="845.0" y="413.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Object storage</text>
<text x="845.0" y="433.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">durable home of every namespace</text>
<rect x="645" y="460" width="400" height="85" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="845.0" y="495.5" font-size="28" text-anchor="middle">🧾</text>
<text x="845.0" y="518.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Usage-based billing</text>
<text x="845.0" y="538.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">storage + reads + writes</text>
<text x="550" y="610.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">A search runs inside one namespace, so one namespace per customer keeps tenants apart and fast.</text>
<text x="550" y="640.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">There is nothing to install or operate: no servers, shards or replicas to size.</text>

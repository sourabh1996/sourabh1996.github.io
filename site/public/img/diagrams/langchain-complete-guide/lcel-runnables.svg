<text x="95.0" y="393.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Compose</text>
<rect x="20" y="505" width="1060" height="190" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="515" width="130" height="170" rx="10" fill="#2e7d4f"/>
<text x="95.0" y="596.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Get for</text><text x="95.0" y="623.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">free</text>
<path d="M380.0,175.0 L400.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M605.0,175.0 L625.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="175" y="120" width="205" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="277.5" y="160.0" font-size="28" text-anchor="middle">📝</text>
<text x="277.5" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Prompt template</text>
<text x="277.5" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">dict in</text><text x="277.5" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">PromptValue out</text>
<rect x="400" y="120" width="205" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="502.5" y="160.0" font-size="28" text-anchor="middle">🧠</text>
<text x="502.5" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Chat model</text>
<text x="502.5" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">messages in</text><text x="502.5" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">AIMessage out</text>
<rect x="625" y="120" width="205" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="727.5" y="160.0" font-size="28" text-anchor="middle">🔍</text>
<text x="727.5" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Output parser</text>
<text x="727.5" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">message in</text><text x="727.5" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">str, dict or object out</text>
<rect x="850" y="120" width="210" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="955.0" y="160.0" font-size="28" text-anchor="middle">🐍</text>
<text x="955.0" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Your function</text>
<text x="955.0" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RunnableLambda</text><text x="955.0" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">any Python code</text>
<rect x="175" y="320" width="205" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="277.5" y="370.0" font-size="28" text-anchor="middle">➡️</text>
<text x="277.5" y="393.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">a | b | c</text>
<text x="277.5" y="413.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RunnableSequence</text><text x="277.5" y="428.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">steps in order</text>
<rect x="400" y="320" width="205" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="502.5" y="370.0" font-size="28" text-anchor="middle">🔀</text>
<text x="502.5" y="393.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">{&quot;x&quot;: a, &quot;y&quot;: b}</text>
<text x="502.5" y="413.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RunnableParallel</text><text x="502.5" y="428.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">same input, side by side</text>
<rect x="625" y="320" width="205" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="727.5" y="370.0" font-size="28" text-anchor="middle">➕</text>
<text x="727.5" y="393.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">.assign(...)</text>
<text x="727.5" y="413.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RunnablePassthrough</text><text x="727.5" y="428.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">keep input, add keys</text>
<rect x="850" y="320" width="210" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="955.0" y="370.0" font-size="28" text-anchor="middle">🚦</text>
<text x="955.0" y="393.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">RunnableBranch</text>
<text x="955.0" y="413.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">pick a path</text><text x="955.0" y="428.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">by condition</text>
<rect x="175" y="540" width="205" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="277.5" y="585.0" font-size="28" text-anchor="middle">⚡</text>
<text x="277.5" y="608.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">invoke · batch · stream</text>
<text x="277.5" y="628.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">plus async twins</text><text x="277.5" y="643.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">ainvoke, abatch, astream</text>
<rect x="400" y="540" width="205" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="502.5" y="585.0" font-size="28" text-anchor="middle">🛟</text>
<text x="502.5" y="608.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Retries, fallbacks</text>
<text x="502.5" y="628.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with_retry()</text><text x="502.5" y="643.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with_fallbacks([...])</text>
<rect x="625" y="540" width="205" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="727.5" y="585.0" font-size="28" text-anchor="middle">🏷️</text>
<text x="727.5" y="608.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Config and tracing</text>
<text x="727.5" y="628.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">tags, metadata, callbacks</text><text x="727.5" y="643.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">seen in LangSmith</text>
<rect x="850" y="540" width="210" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="955.0" y="585.0" font-size="28" text-anchor="middle">📐</text>
<text x="955.0" y="608.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Schemas and graph</text>
<text x="955.0" y="628.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">input_schema, output_schema</text><text x="955.0" y="643.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">get_graph()</text>
<text x="618" y="728.0" font-size="15" font-weight="600" fill="#2b5fa8" text-anchor="middle">A composed chain is itself a Runnable, so it can be a step inside a bigger chain.</text>
</svg>
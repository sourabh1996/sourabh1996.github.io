<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="From variables to messages: a chat prompt template">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="638" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#9a6412"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">From variables to messages: a chat prompt template</text>
<rect x="30" y="95" width="280" height="510" rx="14" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="51.2" y="80" width="237.6" height="30" rx="15" fill="#2f5fb3"/>
<text x="170.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Inputs (change every call)</text>
<rect x="345" y="95" width="360" height="510" rx="14" fill="none" stroke="#e0b25c" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="419.1" y="80" width="211.79999999999998" height="30" rx="15" fill="#9a6412"/>
<text x="525.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Template (written once)</text>
<rect x="740" y="95" width="330" height="510" rx="14" fill="none" stroke="#7cc49a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="777.6" y="80" width="254.79999999999998" height="30" rx="15" fill="#2e7d4f"/>
<text x="905.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt value (sent to model)</text>

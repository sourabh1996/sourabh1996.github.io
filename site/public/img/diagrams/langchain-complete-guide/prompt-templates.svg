<path d="M290.0,285.0 L365.0,195.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M290.0,407.5 L365.0,345.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M290.0,527.5 L365.0,495.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M685.0,195.0 L760.0,180.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="690.5" y="164.5" width="64.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="722.5" y="178.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">invoke()</text>
<path d="M685.0,345.0 L760.0,280.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M685.0,345.0 L760.0,365.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M685.0,495.0 L760.0,455.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="50" y="130" width="240" height="85" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="170.0" y="161.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">📌 Partials</text>
<text x="170.0" y="181.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">fixed in advance:</text><text x="170.0" y="197.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">date = &quot;17 Oct&quot;</text>
<rect x="50" y="230" width="240" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="170.0" y="270.0" font-size="28" text-anchor="middle">🧾</text>
<text x="170.0" y="293.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Variables</text>
<text x="170.0" y="313.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">station = &quot;Howrah&quot;</text><text x="170.0" y="328.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">language = &quot;Bengali&quot;</text>
<rect x="50" y="355" width="240" height="105" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="170.0" y="392.5" font-size="28" text-anchor="middle">🗂️</text>
<text x="170.0" y="415.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Chat history</text>
<text x="170.0" y="435.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">earlier Human and AI</text><text x="170.0" y="451.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">messages, as a list</text>
<rect x="50" y="475" width="240" height="105" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="170.0" y="512.5" font-size="28" text-anchor="middle">❓</text>
<text x="170.0" y="535.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">New question</text>
<text x="170.0" y="555.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">question =</text><text x="170.0" y="571.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Is 12301 late?&quot;</text>
<rect x="365" y="135" width="320" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="525.0" y="180.0" font-size="28" text-anchor="middle">📜</text>
<text x="525.0" y="203.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">(&quot;system&quot;, ...)</text>
<text x="525.0" y="223.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">You help passengers at {station}.</text><text x="525.0" y="238.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Reply in {language}. Today is {date}.</text>
<rect x="365" y="285" width="320" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="525.0" y="330.0" font-size="28" text-anchor="middle">🧷</text>
<text x="525.0" y="353.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">MessagesPlaceholder</text>
<text x="525.0" y="373.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;history&quot;: a slot for</text><text x="525.0" y="388.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a whole list of messages</text>
<rect x="365" y="435" width="320" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="525.0" y="488.0" font-size="28" text-anchor="middle">🙋</text>
<text x="525.0" y="511.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">(&quot;human&quot;, &quot;{question}&quot;)</text>
<text x="525.0" y="531.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the user&#x27;s new message</text>
<rect x="760" y="135" width="290" height="90" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="905.0" y="169.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">SystemMessage</text>
<text x="905.0" y="189.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">You help passengers at Howrah.</text><text x="905.0" y="204.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Reply in Bengali. Today is 17 Oct.</text>
<rect x="760" y="245" width="290" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="905.0" y="277.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">HumanMessage</text>
<text x="905.0" y="297.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(from history)</text>
<rect x="760" y="330" width="290" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="905.0" y="362.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">AIMessage</text>
<text x="905.0" y="382.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(from history)</text>
<rect x="760" y="415" width="290" height="80" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="905.0" y="452.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">HumanMessage</text>
<text x="905.0" y="472.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Is 12301 late?</text>
<rect x="760" y="515" width="290" height="70" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="905.0" y="555.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">🧠 → any chat model</text>
</svg>
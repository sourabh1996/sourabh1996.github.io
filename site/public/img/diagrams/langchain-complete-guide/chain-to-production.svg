<text x="300.0" y="186.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Web and mobile apps</text>
<text x="300.0" y="206.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">POST /invoke, /stream</text>
<rect x="470" y="115" width="250" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="595.0" y="155.0" font-size="28" text-anchor="middle">🐍</text>
<text x="595.0" y="178.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Python services</text>
<text x="595.0" y="198.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RemoteRunnable or</text><text x="595.0" y="213.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">httpx / LangGraph SDK</text>
<rect x="765" y="115" width="295" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>

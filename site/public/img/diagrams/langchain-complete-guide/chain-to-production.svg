<text x="912.5" y="198.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">playground, Studio,</text><text x="912.5" y="213.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">trace viewer</text>
<rect x="175" y="305" width="250" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="300.0" y="367.0" font-size="28" text-anchor="middle">🚪</text>
<text x="300.0" y="390.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">HTTP layer</text>
<text x="300.0" y="410.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">LangServe add_routes (legacy)</text><text x="300.0" y="425.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or your FastAPI routes</text><text x="300.0" y="441.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or the Agent Server</text>
<rect x="470" y="305" width="250" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="595.0" y="367.0" font-size="28" text-anchor="middle">⛓️</text>
<text x="595.0" y="390.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Your runnable</text>
<text x="595.0" y="410.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">prompt | model | parser</text><text x="595.0" y="425.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or a LangGraph graph</text><text x="595.0" y="441.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">same code as in dev</text>
<rect x="765" y="305" width="295" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="912.5" y="367.0" font-size="28" text-anchor="middle">🏗️</text>
<text x="912.5" y="390.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Around it</text>
<text x="912.5" y="410.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">keys in env vars, auth,</text><text x="912.5" y="425.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">rate limits, timeouts,</text><text x="912.5" y="441.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">checkpointer DB, Docker</text>
<rect x="470" y="555" width="250" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="595.0" y="605.0" font-size="28" text-anchor="middle">🔭</text>
<text x="595.0" y="628.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Traces</text>
<text x="595.0" y="648.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every step: inputs, outputs,</text><text x="595.0" y="663.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">latency, tokens, errors</text>
<rect x="765" y="555" width="295" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="912.5" y="605.0" font-size="28" text-anchor="middle">📈</text>
<text x="912.5" y="628.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Monitoring</text>
<text x="912.5" y="648.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">dashboards, alerts,</text><text x="912.5" y="663.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">feedback, cost</text>
<rect x="175" y="555" width="250" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="300.0" y="605.0" font-size="28" text-anchor="middle">🧪</text>
<text x="300.0" y="628.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Datasets and evals</text>
<text x="300.0" y="648.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">replay real cases after</text><text x="300.0" y="663.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every change; prompt versions</text>
<text x="618" y="738.0" font-size="15" font-weight="600" fill="#5b3fa0" text-anchor="middle">The chain itself doesn&#x27;t change: serving and tracing are layers around the same runnable.</text>

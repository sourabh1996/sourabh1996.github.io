<text x="95.0" y="216.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Native</text><text x="95.0" y="243.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">route</text>
<rect x="20" y="375" width="1060" height="270" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="385" width="130" height="250" rx="10" fill="#1f766d"/>
<text x="95.0" y="506.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Parser</text><text x="95.0" y="533.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">route</text>
<path d="M385.0,165.0 L430.0,165.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M680.0,165.0 L725.0,165.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M892.5,220.0 L892.5,245.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

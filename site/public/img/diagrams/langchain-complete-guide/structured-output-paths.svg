<path d="M680.0,455.0 L725.0,455.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M892.5,510.0 L892.5,535.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M725.0,580.0 L680.0,580.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M725.0,290.0 L680.0,290.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="175" y="110" width="210" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="280.0" y="150.0" font-size="28" text-anchor="middle">📐</text>
<text x="280.0" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Schema</text>
<text x="280.0" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">TypedDict, Pydantic</text><text x="280.0" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or JSON Schema</text>
<rect x="430" y="110" width="250" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="555.0" y="150.0" font-size="28" text-anchor="middle">🧩</text>
<text x="555.0" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">with_structured_output</text>
<text x="555.0" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">schema sent to the API</text><text x="555.0" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">as a tool or JSON schema</text>
<rect x="725" y="110" width="335" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="892.5" y="150.0" font-size="28" text-anchor="middle">🧠</text>
<text x="892.5" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model API</text>
<text x="892.5" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">constrained to the schema</text><text x="892.5" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(tool call or native JSON)</text>
<rect x="725" y="245" width="335" height="90" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="892.5" y="283.0" font-size="28" text-anchor="middle">✅</text>
<text x="892.5" y="306.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">dict or Pydantic object</text>
<text x="892.5" y="326.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">validated by the schema</text>
<rect x="430" y="245" width="250" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="555.0" y="275.0" font-size="28" text-anchor="middle">🧾</text>
<text x="555.0" y="298.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">include_raw=True</text>
<text x="555.0" y="318.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">also returns the raw message</text><text x="555.0" y="333.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and any parsing_error</text>
<rect x="175" y="400" width="210" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="280.0" y="440.0" font-size="28" text-anchor="middle">📐</text>
<text x="280.0" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Schema</text>
<text x="280.0" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Pydantic model or</text><text x="280.0" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">ResponseSchema list</text>
<rect x="430" y="400" width="250" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="555.0" y="440.0" font-size="28" text-anchor="middle">📝</text>
<text x="555.0" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Format instructions</text>
<text x="555.0" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">parser.get_format_instructions()</text><text x="555.0" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">go into the prompt</text>
<rect x="725" y="400" width="335" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="892.5" y="440.0" font-size="28" text-anchor="middle">🤖</text>
<text x="892.5" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Any model</text>
<text x="892.5" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">even ones without tool calling</text><text x="892.5" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">replies with text containing JSON</text>
<rect x="725" y="535" width="335" height="90" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="892.5" y="573.0" font-size="28" text-anchor="middle">🔍</text>
<text x="892.5" y="596.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Output parser</text>
<text x="892.5" y="616.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">find JSON, parse, validate</text>
<rect x="430" y="535" width="250" height="90" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="555.0" y="573.0" font-size="28" text-anchor="middle">✅</text>
<text x="555.0" y="596.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">dict or object</text>
<text x="555.0" y="616.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or OutputParserException</text>
<text x="618" y="685.0" font-size="15" font-weight="600" fill="#5b3fa0" text-anchor="middle">Prefer the native route when the model supports it; use parsers for older or local models, or plain text.</text>
</svg>
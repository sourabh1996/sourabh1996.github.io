<rect x="1" y="1" width="1098" height="718" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Two roads to structured data</text>
<rect x="20" y="85" width="1060" height="270" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>

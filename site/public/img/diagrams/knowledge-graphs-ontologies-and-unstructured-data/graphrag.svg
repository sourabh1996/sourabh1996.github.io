<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" width="1260" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="GraphRAG: index once, query four ways">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1258" height="638" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">GraphRAG: index once, query four ways</text>
<rect x="20" y="80" width="1220" height="220" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="90" width="110" height="200" rx="10" fill="#5b3fa0"/>
<text x="85.0" y="198.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Index</text>
<rect x="20" y="320" width="1220" height="250" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="330" width="110" height="230" rx="10" fill="#2f5fb3"/>
<text x="85.0" y="453.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Query</text>
<path d="M340.0,190.0 L365.0,190.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M565.0,190.0 L590.0,190.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M790.0,190.0 L815.0,190.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1015.0,190.0 L1040.0,190.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M690.0,265.0 L690.0,310.0 L275.0,310.0 L275.0,360.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424.0" y="286.0" width="92.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="470" y="300.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">entity graph</text>
<path d="M1135.0,265.0 L1135.0,330.0 L550.0,330.0 L550.0,360.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="871.5" y="306.0" width="57.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="900" y="320.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">reports</text>
<rect x="150" y="115" width="190" height="150" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="245.0" y="175.0" font-size="28" text-anchor="middle">📄</text>
<text x="245.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Text units</text>
<text x="245.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">documents split</text><text x="245.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">into chunks</text>
<rect x="365" y="115" width="200" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="465.0" y="167.0" font-size="28" text-anchor="middle">🧠</text>
<text x="465.0" y="190.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Extract</text>
<text x="465.0" y="210.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">entities and relations</text><text x="465.0" y="225.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with descriptions</text><text x="465.0" y="241.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(LLM per chunk)</text>
<rect x="590" y="115" width="200" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="690.0" y="167.0" font-size="28" text-anchor="middle">📝</text>
<text x="690.0" y="190.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Summarise</text>
<text x="690.0" y="210.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">merge duplicate</text><text x="690.0" y="225.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">descriptions of</text><text x="690.0" y="241.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">each entity</text>
<rect x="815" y="115" width="200" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="915.0" y="175.0" font-size="28" text-anchor="middle">🫧</text>
<text x="915.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Communities</text>
<text x="915.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Leiden clustering</text><text x="915.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">hierarchy of levels</text>
<rect x="1040" y="115" width="190" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="1135.0" y="175.0" font-size="28" text-anchor="middle">📑</text>
<text x="1135.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Reports</text>
<text x="1135.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">LLM writes a report</text><text x="1135.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">per community</text>
<rect x="150" y="360" width="250" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="275.0" y="422.0" font-size="28" text-anchor="middle">📍</text>
<text x="275.0" y="445.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Local search</text>
<text x="275.0" y="465.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">entities in the question</text><text x="275.0" y="480.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">expand neighbours</text><text x="275.0" y="496.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">facts + source text</text>
<rect x="425" y="360" width="250" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="422.0" font-size="28" text-anchor="middle">🌐</text>
<text x="550.0" y="445.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Global search</text>
<text x="550.0" y="465.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">map: each report</text><text x="550.0" y="480.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">gives scored points</text><text x="550.0" y="496.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reduce: one answer</text>
<rect x="700" y="360" width="250" height="170" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="825.0" y="422.0" font-size="28" text-anchor="middle">🧭</text>
<text x="825.0" y="445.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">DRIFT search</text>
<text x="825.0" y="465.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">start from reports</text><text x="825.0" y="480.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">then drill down</text><text x="825.0" y="496.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with local search</text>
<rect x="975" y="360" width="255" height="170" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="1102.5" y="422.0" font-size="28" text-anchor="middle">🔎</text>
<text x="1102.5" y="445.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Basic search</text>
<text x="1102.5" y="465.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">plain vector search</text><text x="1102.5" y="480.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">over text units</text><text x="1102.5" y="496.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(the baseline)</text>
<text x="630" y="610.0" font-size="13.5" font-weight="500" fill="#57606a" text-anchor="middle">Indexing makes many LLM calls once; queries reuse the graph and reports. Pick the mode by the question: specific, global, both, or simple look-up.</text>
</svg>
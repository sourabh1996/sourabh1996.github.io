<text x="40" y="640.0" font-size="15" font-weight="700" fill="#5b3fa0" text-anchor="start">How to read it</text>
<text x="40" y="666.0" font-size="13.5" font-weight="500" fill="#57606a" text-anchor="start">Box = class (a kind of thing). Small text in a box = datatype properties (plain values such as dates and prices).</text>
<text x="40" y="690.0" font-size="13.5" font-weight="500" fill="#57606a" text-anchor="start">Solid arrow = object property, drawn from its domain class to its range class: an Order is placedBy exactly one Customer.</text>
<text x="40" y="714.0" font-size="13.5" font-weight="500" fill="#57606a" text-anchor="start">Dashed arrows on the right = subClassOf: every Tea is a Product, so it inherits name, priceInr, soldBy and inCategory.</text>

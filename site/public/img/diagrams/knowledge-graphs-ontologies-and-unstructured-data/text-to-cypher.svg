<text x="775.0" y="231.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">valid</text>
<path d="M990.0,240.0 L1030.0,240.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="992.0" y="217.0" width="36.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="1010.0" y="231.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">rows</text>

<rect x="998.0" y="561.0" width="64.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="1030" y="575.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">doubtful</text>
<rect x="150" y="100" width="220" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="260.0" y="138.0" font-size="28" text-anchor="middle">🖨️</text>
<text x="260.0" y="161.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Scanned invoice</text>
<text x="260.0" y="181.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">image only, no text layer</text>
<rect x="390" y="100" width="220" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="500.0" y="138.0" font-size="28" text-anchor="middle">📄</text>
<text x="500.0" y="161.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Born-digital PDF</text>
<text x="500.0" y="181.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">has a text layer</text>
<rect x="630" y="100" width="220" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="740.0" y="138.0" font-size="28" text-anchor="middle">📱</text>
<text x="740.0" y="161.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Phone photo</text>
<text x="740.0" y="181.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">skewed, shadows</text>
<rect x="870" y="100" width="260" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="1000.0" y="138.0" font-size="28" text-anchor="middle">✉️</text>
<text x="1000.0" y="161.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Email or chat</text>
<text x="1000.0" y="181.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">plain text, attachments</text>
<rect x="150" y="255" width="300" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="300.0" y="290.0" font-size="28" text-anchor="middle">🔤</text>
<text x="300.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Text layer or OCR</text>
<text x="300.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">PyMuPDF for digital PDFs</text><text x="300.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Tesseract, PaddleOCR for images</text>
<rect x="480" y="255" width="300" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="630.0" y="290.0" font-size="28" text-anchor="middle">🧱</text>
<text x="630.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Layout and tables</text>
<text x="630.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reading order, boxes, rows, cells</text><text x="630.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Docling, Unstructured, cloud APIs</text>
<rect x="810" y="255" width="320" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="970.0" y="290.0" font-size="28" text-anchor="middle">👁️</text>
<text x="970.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Or: a vision LLM reads it</text>
<text x="970.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">PDF or image straight to the model</text><text x="970.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">fewer steps, more cost per page</text>
<rect x="150" y="425" width="300" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="300.0" y="460.0" font-size="28" text-anchor="middle">🧠</text>
<text x="300.0" y="483.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">LLM extraction</text>
<text x="300.0" y="503.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">entities and relations</text><text x="300.0" y="518.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">guided by an ontology</text>
<rect x="480" y="425" width="300" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="630.0" y="460.0" font-size="28" text-anchor="middle">🧾</text>
<text x="630.0" y="483.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Pydantic schema</text>
<text x="630.0" y="503.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">types, rules, totals add up</text><text x="630.0" y="518.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">retry with the error message</text>
<rect x="810" y="425" width="320" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="970.0" y="460.0" font-size="28" text-anchor="middle">🔗</text>
<text x="970.0" y="483.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Entity resolution</text>
<text x="970.0" y="503.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&#x27;Deccan Millets Pvt Ltd&#x27; = &#x27;DECCAN MILLETS&#x27;</text><text x="970.0" y="518.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">match, cluster, pick one record</text>
<rect x="150" y="590" width="300" height="90" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="300.0" y="628.0" font-size="28" text-anchor="middle">🗃️</text>
<text x="300.0" y="651.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Clean records</text>
<text x="300.0" y="671.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">database, spreadsheet, ERP</text>
<rect x="480" y="590" width="300" height="90" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="630.0" y="628.0" font-size="28" text-anchor="middle">🕸️</text>
<text x="630.0" y="651.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Knowledge graph</text>
<text x="630.0" y="671.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">suppliers, invoices, items linked</text>
<rect x="810" y="590" width="320" height="90" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="970.0" y="628.0" font-size="28" text-anchor="middle">🙋</text>
<text x="970.0" y="651.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Human review queue</text>
<text x="970.0" y="671.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">low confidence or failed checks</text>
<text x="590" y="735.0" font-size="13.5" font-weight="500" fill="#57606a" text-anchor="middle">Every arrow can fail. Each stage records confidence and provenance (which file, page and box a value came from) so errors can be traced and reviewed.</text>

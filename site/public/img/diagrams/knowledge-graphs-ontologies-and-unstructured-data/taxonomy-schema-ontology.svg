<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Taxonomy vs schema vs ontology">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="798" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Taxonomy vs schema vs ontology</text>
<rect x="30" y="100" width="330" height="450" rx="14" fill="none" stroke="#7cc49a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="153.6" y="85" width="82.8" height="30" rx="15" fill="#2e7d4f"/>
<text x="195.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Taxonomy</text>
<rect x="385" y="100" width="330" height="450" rx="14" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="517.2" y="85" width="65.6" height="30" rx="15" fill="#2f5fb3"/>
<text x="550.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Schema</text>
<rect x="740" y="100" width="330" height="450" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="863.6" y="85" width="82.8" height="30" rx="15" fill="#5b3fa0"/>
<text x="905.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Ontology</text>
<path d="M195.0,174.0 L195.0,200.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195.0,244.0 L110.0,270.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195.0,244.0 L275.0,270.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M110.0,314.0 L110.0,340.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M110.0,384.0 L110.0,410.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M225.0,660.0 L250.0,660.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M435.0,660.0 L460.0,660.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M645.0,660.0 L670.0,660.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855.0,660.0 L880.0,660.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="125" y="130" width="140" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="195.0" y="157.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Products</text>
<rect x="125" y="200" width="140" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="195.0" y="227.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Beverages</text>
<rect x="50" y="270" width="120" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="110.0" y="297.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Tea</text>
<rect x="215" y="270" width="120" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="275.0" y="297.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Coffee</text>
<rect x="50" y="340" width="120" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="110.0" y="367.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Black Tea</text>
<rect x="50" y="410" width="120" height="44" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="110.0" y="437.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Assam</text>
<text x="265.0" y="384.0" font-size="14" font-weight="700" fill="#2e7d4f" text-anchor="middle">One relation:</text>
<text x="265.0" y="404.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;is a kind of&quot;</text><text x="265.0" y="419.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="265.0" y="435.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Answers:</text><text x="265.0" y="450.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">What kind of</text><text x="265.0" y="466.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thing is this?</text><text x="265.0" y="482.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">What&#x27;s under</text><text x="265.0" y="497.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Tea?</text>
<rect x="405" y="135" width="290" height="150" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="179.0" font-size="28" text-anchor="middle">🗄️</text>
<text x="550.0" y="202.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">products table</text>
<text x="550.0" y="222.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">id TEXT PRIMARY KEY</text><text x="550.0" y="237.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">name TEXT NOT NULL</text><text x="550.0" y="253.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">price_inr INTEGER</text><text x="550.0" y="268.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">seller_id TEXT -&gt; sellers.id</text>
<text x="550.0" y="369.0" font-size="14" font-weight="700" fill="#2f5fb3" text-anchor="middle">Describes storage:</text>
<text x="550.0" y="389.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">which fields, which types,</text><text x="550.0" y="404.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">which are required,</text><text x="550.0" y="420.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">which keys point where</text><text x="550.0" y="435.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="550.0" y="451.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Answers:</text><text x="550.0" y="467.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Is this record valid</text><text x="550.0" y="482.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">for this database?</text>
<rect x="760" y="135" width="290" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="905.0" y="179.0" font-size="28" text-anchor="middle">📐</text>
<text x="905.0" y="202.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Classes + relations + rules</text>
<text x="905.0" y="222.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Tea subClassOf Product</text><text x="905.0" y="237.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Order placedBy exactly 1 Customer</text><text x="905.0" y="253.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Tea disjointWith SpiceMix</text><text x="905.0" y="268.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">soldBy: Product -&gt; Seller</text>
<text x="905.0" y="377.0" font-size="14" font-weight="700" fill="#5b3fa0" text-anchor="middle">Describes meaning:</text>
<text x="905.0" y="397.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">what things are, how they</text><text x="905.0" y="412.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">relate, what must be true</text><text x="905.0" y="428.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="905.0" y="443.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Answers:</text><text x="905.0" y="459.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">What can we conclude?</text><text x="905.0" y="475.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Does this fact make sense?</text>
<rect x="40" y="625" width="185" height="70" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="132.5" y="657.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Controlled vocabulary</text>
<text x="132.5" y="677.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">agreed list of terms</text>
<rect x="250" y="625" width="185" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="342.5" y="657.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Taxonomy</text>
<text x="342.5" y="677.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">terms in a hierarchy</text>
<rect x="460" y="625" width="185" height="70" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="552.5" y="657.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Thesaurus</text>
<text x="552.5" y="677.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ synonyms, related</text>
<rect x="670" y="625" width="185" height="70" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="762.5" y="657.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Ontology</text>
<text x="762.5" y="677.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ relations, rules</text>
<rect x="880" y="625" width="185" height="70" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="972.5" y="657.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Knowledge graph</text>
<text x="972.5" y="677.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">ontology + real facts</text>
<text x="550" y="600.0" font-size="15" font-weight="700" fill="#5b3fa0" text-anchor="middle">More meaning, more effort to build and maintain  →</text>
<text x="550" y="740.0" font-size="14" font-weight="500" fill="#57606a" text-anchor="middle">A schema can sit beside any of these: it says how the data is stored, not what it means.</text>
<text x="550" y="765.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Pick the lightest one that answers your questions.</text>
</svg>
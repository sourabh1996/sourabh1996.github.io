<text x="550.0" y="196.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Ontology: the rulebook</text>
<text x="550.0" y="216.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">classes, relationships, constraints</text>
<rect x="390" y="245" width="320" height="105" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="282.5" font-size="28" text-anchor="middle">🕸️</text>
<text x="550.0" y="305.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Knowledge graph</text>
<text x="550.0" y="325.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(Priya)-[:PLACED]-&gt;(Order 1001)</text><text x="550.0" y="341.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">-[:CONTAINS]-&gt;(Assam Tea)</text>
<rect x="390" y="368" width="320" height="56" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="401.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">🗄️ Neo4j (Cypher) or RDF store (SPARQL)</text>
<rect x="795" y="140" width="250" height="80" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="920.0" y="173.0" font-size="28" text-anchor="middle">🧠</text>
<text x="920.0" y="196.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">GraphRAG</text>
<text x="920.0" y="216.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">answers that follow connections</text>
<rect x="795" y="245" width="250" height="80" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="920.0" y="278.0" font-size="28" text-anchor="middle">🤖</text>
<text x="920.0" y="301.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Text-to-Cypher agent</text>
<text x="920.0" y="321.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">questions become graph queries</text>
<rect x="795" y="350" width="250" height="72" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="920.0" y="379.0" font-size="28" text-anchor="middle">🛡️</text>
<text x="920.0" y="402.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Ontology-grounded agent</text>
<text x="920.0" y="422.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">checks facts against the rules</text>
<text x="550" y="490.0" font-size="16" font-weight="700" fill="#1f766d" text-anchor="middle">Each module adds one layer. By the end you can build every box on this page.</text>
<text x="550" y="520.0" font-size="14" font-weight="500" fill="#57606a" text-anchor="middle">Running examples: an online tea shop, a company graph and a pile of supplier invoices.</text>
<text x="550" y="548.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Runnable code uses plain Python, sqlite3 and Pydantic. Neo4j and LLM calls are shown with real syntax.</text>

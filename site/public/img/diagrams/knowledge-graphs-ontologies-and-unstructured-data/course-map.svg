<text x="180.0" y="278.0" font-size="28" text-anchor="middle">🔍</text>
<text x="180.0" y="301.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Extract</text>
<text x="180.0" y="321.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">OCR, layout, LLM + Pydantic</text>
<rect x="55" y="350" width="250" height="72" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="180.0" y="379.0" font-size="28" text-anchor="middle">🧩</text>
<text x="180.0" y="402.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Resolve duplicates</text>
<text x="180.0" y="422.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;A. Sharma&quot; = &quot;Anita Sharma&quot;</text>

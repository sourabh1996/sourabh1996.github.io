<text x="940.0" y="311.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">more lists = higher recall</text><text x="940.0" y="326.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">misses sit near borders</text><text x="940.0" y="342.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">needs training data</text>

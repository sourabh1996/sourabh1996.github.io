<text x="940.0" y="512.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">8 one-byte codes</text>
<text x="940.0" y="532.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">[17, 203, 31, ... 64]</text>
<rect x="590" y="590" width="210" height="130" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="695.0" y="644.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Lookup tables</text>
<text x="695.0" y="664.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">approximate score =</text><text x="695.0" y="679.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">sum of 8 table lookups</text>
<rect x="835" y="590" width="210" height="130" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>

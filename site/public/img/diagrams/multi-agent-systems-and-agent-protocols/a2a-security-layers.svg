<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Five layers of A2A security">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="738" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Five layers of A2A security</text>
<rect x="315" y="80" width="470" height="615" rx="14" fill="none" stroke="#b8bec6" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="418.3" y="65" width="263.4" height="30" rx="15" fill="#4b5563"/>
<text x="550.0" y="85.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Every request passes all five</text>
<path d="M220.0,370.0 L330.0,390.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M770.0,390.0 L880.0,370.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="30" y="300" width="190" height="140" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="125.0" y="363.0" font-size="28" text-anchor="middle">🧭</text>
<text x="125.0" y="386.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Client agent</text>
<text x="125.0" y="406.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts for a user</text>
<rect x="880" y="300" width="190" height="140" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="975.0" y="363.0" font-size="28" text-anchor="middle">🚆</text>
<text x="975.0" y="386.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Remote agent</text>
<text x="975.0" y="406.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">another owner</text>
<rect x="330" y="110" width="440" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="153.0" font-size="28" text-anchor="middle">🔒</text>
<text x="550.0" y="176.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">1. Transport</text>
<text x="550.0" y="196.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">HTTPS / TLS 1.3, certificate checks, optional mTLS</text>
<rect x="330" y="225" width="440" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="550.0" y="268.0" font-size="28" text-anchor="middle">🪪</text>
<text x="550.0" y="291.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">2. Identity</text>
<text x="550.0" y="311.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">signed Agent Card, OAuth 2.0 / OIDC tokens, API keys</text>
<rect x="330" y="340" width="440" height="100" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="550.0" y="383.0" font-size="28" text-anchor="middle">🚦</text>
<text x="550.0" y="406.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">3. Authorisation</text>
<text x="550.0" y="426.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">scopes per skill, tasks visible only to their owner</text>
<rect x="330" y="455" width="440" height="100" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="550.0" y="498.0" font-size="28" text-anchor="middle">🧪</text>
<text x="550.0" y="521.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">4. Content</text>
<text x="550.0" y="541.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">validate parts, treat remote text as untrusted, no SSRF</text>
<rect x="330" y="570" width="440" height="100" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="550.0" y="613.0" font-size="28" text-anchor="middle">📈</text>
<text x="550.0" y="636.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">5. Operations</text>
<text x="550.0" y="656.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">rate limits, audit logs without secrets, key rotation</text>
</svg>
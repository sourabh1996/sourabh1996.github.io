<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="1100" height="840" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="What an Agent Card tells a client">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="838" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">What an Agent Card tells a client</text>
<rect x="25" y="655" width="1050" height="160" rx="14" fill="none" stroke="#b8bec6" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="405.4" y="640" width="289.2" height="30" rx="15" fill="#4b5563"/>
<text x="550.0" y="660.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Three ways a client finds a card</text>
<path d="M420.0,365.0 L350.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M420.0,365.0 L350.0,365.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M420.0,365.0 L350.0,555.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M680.0,365.0 L750.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M680.0,365.0 L750.0,365.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M680.0,365.0 L750.0,555.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="310" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="195.0" y="152.0" font-size="28" text-anchor="middle">🪪</text>
<text x="195.0" y="175.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Who is it?</text>
<text x="195.0" y="195.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">name, description, version</text><text x="195.0" y="210.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">provider, iconUrl,</text><text x="195.0" y="226.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">documentationUrl</text>
<rect x="40" y="290" width="310" height="150" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="195.0" y="342.0" font-size="28" text-anchor="middle">🔌</text>
<text x="195.0" y="365.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Where and how?</text>
<text x="195.0" y="385.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">supportedInterfaces[]:</text><text x="195.0" y="400.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">url, protocolBinding,</text><text x="195.0" y="416.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">protocolVersion, tenant</text>
<rect x="40" y="480" width="310" height="150" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="195.0" y="532.0" font-size="28" text-anchor="middle">🧠</text>
<text x="195.0" y="555.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">What can it do?</text>
<text x="195.0" y="575.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">skills[]: id, name, tags,</text><text x="195.0" y="590.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">examples, input/output</text><text x="195.0" y="606.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">modes</text>
<rect x="420" y="270" width="260" height="190" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="550.0" y="342.0" font-size="28" text-anchor="middle">📄</text>
<text x="550.0" y="365.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Agent Card</text>
<text x="550.0" y="385.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">one JSON document</text><text x="550.0" y="400.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">served by the</text><text x="550.0" y="416.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">remote agent</text>
<rect x="750" y="100" width="310" height="150" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="905.0" y="152.0" font-size="28" text-anchor="middle">⚙️</text>
<text x="905.0" y="175.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Which features?</text>
<text x="905.0" y="195.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">capabilities: streaming,</text><text x="905.0" y="210.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">pushNotifications,</text><text x="905.0" y="226.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">extensions, extendedAgentCard</text>
<rect x="750" y="290" width="310" height="150" rx="12" fill="#fbe9f2" stroke="#e597bd" stroke-width="2"/>
<text x="905.0" y="342.0" font-size="28" text-anchor="middle">🔐</text>
<text x="905.0" y="365.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Who may call it?</text>
<text x="905.0" y="385.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">securitySchemes</text><text x="905.0" y="400.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(OAuth 2.0, API key, mTLS ...)</text><text x="905.0" y="416.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">securityRequirements</text>
<rect x="750" y="480" width="310" height="150" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="905.0" y="532.0" font-size="28" text-anchor="middle">✍️</text>
<text x="905.0" y="555.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Can I trust it?</text>
<text x="905.0" y="575.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">signatures[]: JWS over</text><text x="905.0" y="590.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the JCS-canonical card</text><text x="905.0" y="606.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(signatures removed)</text>
<rect x="40" y="700" width="310" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="195.0" y="742.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Well-known URL</text>
<text x="195.0" y="762.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">/.well-known/agent-card.json</text>
<rect x="395" y="700" width="310" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="742.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Registry or catalogue</text>
<text x="550.0" y="762.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">search by skill or tag</text>
<rect x="750" y="700" width="310" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="905.0" y="742.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Direct configuration</text>
<text x="905.0" y="762.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">URL or card in config</text>
</svg>
<text x="205.0" y="213.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">owns the files, the UI</text><text x="205.0" y="228.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and the user&#x27;s consent</text>
<rect x="60" y="280" width="290" height="95" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="205.0" y="314.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">fs/read_text_file</text><text x="205.0" y="333.2" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">fs/write_text_file</text>

<text x="535.0" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">One shared thread</text>
<text x="535.0" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every message goes</text><text x="535.0" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">to every agent</text>
<rect x="720" y="345" width="150" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="795.0" y="385.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">✍️ Writer</text>
<rect x="720" y="425" width="150" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="795.0" y="465.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">🧐 Critic</text>
<rect x="720" y="505" width="150" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="795.0" y="545.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">🔍 Fact-checker</text>
<rect x="900" y="390" width="170" height="130" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="985.0" y="444.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Watch the cost</text>
<text x="985.0" y="464.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">each turn re-reads</text><text x="985.0" y="479.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the whole thread</text>
<rect x="160" y="640" width="200" height="160" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="260.0" y="705.0" font-size="28" text-anchor="middle">🧠</text>
<text x="260.0" y="728.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Manager</text>
<text x="260.0" y="748.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">plans, picks next agent,</text><text x="260.0" y="763.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">writes an instruction</text>
<rect x="400" y="625" width="250" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="525.0" y="668.0" font-size="28" text-anchor="middle">📒</text>
<text x="525.0" y="691.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Task ledger</text>
<text x="525.0" y="711.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">facts, guesses, plan</text>
<rect x="400" y="740" width="250" height="120" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="525.0" y="785.0" font-size="28" text-anchor="middle">📈</text>
<text x="525.0" y="808.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Progress ledger</text>
<text x="525.0" y="828.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">done? looping? progressing?</text><text x="525.0" y="843.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">next speaker + instruction</text>
<rect x="700" y="640" width="170" height="160" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="785.0" y="697.0" font-size="28" text-anchor="middle">🧑‍🤝‍🧑</text>
<text x="785.0" y="720.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Specialists</text>
<text x="785.0" y="740.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">web surfer</text><text x="785.0" y="755.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">coder</text><text x="785.0" y="771.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">file reader</text>
<rect x="900" y="655" width="170" height="130" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="985.0" y="697.0" font-size="28" text-anchor="middle">🔁</text>
<text x="985.0" y="720.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Stalled?</text>
<text x="985.0" y="740.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">too many rounds</text><text x="985.0" y="755.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with no progress:</text><text x="985.0" y="771.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">replan</text>

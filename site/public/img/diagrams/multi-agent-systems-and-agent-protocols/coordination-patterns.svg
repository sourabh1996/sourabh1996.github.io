<text x="705.0" y="169.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Refunds agent</text>
<rect x="610" y="205" width="190" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="705.0" y="251.0" font-size="28" text-anchor="middle">🧾</text>
<text x="705.0" y="274.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Billing agent</text>

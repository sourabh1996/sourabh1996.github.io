<text x="955.0" y="160.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Control moves</text>
<text x="955.0" y="180.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a handoff is a tool call:</text><text x="955.0" y="195.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">transfer_to_refunds</text><text x="955.0" y="211.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="955.0" y="226.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the new agent talks</text><text x="955.0" y="242.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">to the customer</text>
<rect x="160" y="380" width="190" height="150" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="255.0" y="440.0" font-size="28" text-anchor="middle">🎙️</text>
<text x="255.0" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Chat manager</text>
<text x="255.0" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">picks who speaks next,</text><text x="255.0" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">decides when to stop</text>
<rect x="420" y="395" width="230" height="120" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>

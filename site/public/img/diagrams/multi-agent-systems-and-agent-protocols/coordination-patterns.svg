<text x="435.0" y="206.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Triage agent</text>
<text x="435.0" y="226.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">holds the baton first</text>
<rect x="610" y="100" width="190" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>

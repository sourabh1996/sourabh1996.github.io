<rect x="1" y="1" width="1098" height="818" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">A2A: how two independent agents work together</text>
<rect x="30" y="95" width="300" height="560" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="69.80000000000001" y="80" width="220.39999999999998" height="30" rx="15" fill="#5b3fa0"/>
<text x="180.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Client agent (your team)</text>
<rect x="770" y="95" width="300" height="560" rx="14" fill="none" stroke="#6cc3b8" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="805.5" y="80" width="229.0" height="30" rx="15" fill="#1f766d"/>
<text x="920.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Remote agent (their team)</text>
<path d="M180.0,225.0 L180.0,260.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M290.0,330.0 L395.0,315.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="328.0" y="299.5" width="29.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="342.5" y="313.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">A2A</text>
<path d="M705.0,315.0 L810.0,330.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="743.0" y="299.5" width="29.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="757.5" y="313.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">A2A</text>
<path d="M180.0,400.0 L180.0,440.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M920.0,400.0 L920.0,440.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="70" y="130" width="220" height="95" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="180.0" y="170.5" font-size="28" text-anchor="middle">🙋</text>
<text x="180.0" y="193.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">User</text>
<text x="180.0" y="213.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Plan my Pune trip&quot;</text>
<rect x="70" y="260" width="220" height="140" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="180.0" y="315.0" font-size="28" text-anchor="middle">🧭</text>
<text x="180.0" y="338.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Trip planner</text>
<text x="180.0" y="358.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">built with LangGraph</text><text x="180.0" y="373.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts as A2A client</text>
<rect x="70" y="440" width="220" height="85" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="180.0" y="487.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">🧰 Its own tools (MCP)</text>
<rect x="70" y="555" width="220" height="80" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="180.0" y="590.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Sees only the card,</text><text x="180.0" y="607.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">tasks and artifacts</text>
<rect x="395" y="105" width="310" height="120" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="150.0" font-size="28" text-anchor="middle">🪪</text>
<text x="550.0" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Step 1: read the Agent Card</text>
<text x="550.0" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">GET /.well-known/agent-card.json</text><text x="550.0" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">name, skills, URL, auth</text>
<rect x="395" y="270" width="310" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="312.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Step 2: SendMessage</text>
<text x="550.0" y="332.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">message with parts (text, file, data)</text>
<rect x="395" y="385" width="310" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="427.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Step 3: track the Task</text>
<text x="550.0" y="447.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">id, contextId, state: WORKING ...</text>
<rect x="395" y="500" width="310" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="542.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">Step 4: receive Artifacts</text>
<text x="550.0" y="562.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">results, streamed, polled or pushed</text>
<rect x="810" y="260" width="220" height="140" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="920.0" y="315.0" font-size="28" text-anchor="middle">🚆</text>
<text x="920.0" y="338.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Rail booking agent</text>
<text x="920.0" y="358.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">built with Google ADK</text><text x="920.0" y="373.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts as A2A server</text>
<rect x="810" y="440" width="220" height="85" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="920.0" y="487.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">🧰 Its own tools (MCP)</text>
<rect x="810" y="555" width="220" height="80" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="920.0" y="590.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Prompts, memory and</text><text x="920.0" y="607.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">tools stay private</text>
<rect x="230" y="690" width="640" height="90" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="550.0" y="728.0" font-size="28" text-anchor="middle">🔌</text>
<text x="550.0" y="751.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Same messages over JSON-RPC, gRPC or HTTP+JSON</text>
<text x="550.0" y="771.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">HTTPS + auth declared in the card (OAuth 2.0, API key, mTLS ...)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Scaling to many tools: load on demand, not up front">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="598" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Scaling to many tools: load on demand, not up front</text>
<rect x="30" y="90" width="330" height="460" rx="14" fill="none" stroke="#ec9a8a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="67.60000000000001" y="75" width="254.79999999999998" height="30" rx="15" fill="#b2442f"/>
<text x="195.0" y="95.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Everything loaded every turn</text>
<rect x="400" y="90" width="670" height="460" rx="14" fill="none" stroke="#7cc49a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="624.8" y="75" width="220.39999999999998" height="30" rx="15" fill="#2e7d4f"/>
<text x="735.0" y="95.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">The fixes (combine them)</text>
<path d="M330.0,185.0 L430.0,185.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M330.0,325.0 L430.0,325.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M330.0,465.0 L430.0,465.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M700.0,465.0 L780.0,465.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="711.5" y="442.0" width="57.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="740.0" y="456.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">runs in</text>
<rect x="60" y="130" width="270" height="110" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="195.0" y="170.0" font-size="28" text-anchor="middle">🧰</text>
<text x="195.0" y="193.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">288 tool schemas</text>
<text x="195.0" y="213.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">~20K-55K+ tokens,</text><text x="195.0" y="228.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">re-sent on every step</text>
<rect x="60" y="270" width="270" height="110" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="195.0" y="310.0" font-size="28" text-anchor="middle">🔀</text>
<text x="195.0" y="333.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Look-alike tools</text>
<text x="195.0" y="353.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">pairs grow ~ n squared;</text><text x="195.0" y="368.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">wrong tool, wrong params</text>
<rect x="60" y="410" width="270" height="110" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="195.0" y="450.0" font-size="28" text-anchor="middle">🌊</text>
<text x="195.0" y="473.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Results flood context</text>
<text x="195.0" y="493.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every result passes</text><text x="195.0" y="508.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">through the model</text>
<rect x="430" y="130" width="270" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="565.0" y="170.0" font-size="28" text-anchor="middle">🔎</text>
<text x="565.0" y="193.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Tool search</text>
<text x="565.0" y="213.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">defer_loading;</text><text x="565.0" y="228.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">load only the matches</text>
<rect x="430" y="270" width="270" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="565.0" y="310.0" font-size="28" text-anchor="middle">✂️</text>
<text x="565.0" y="333.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Fewer task tools</text>
<text x="565.0" y="353.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">merge endpoints, sharpen</text><text x="565.0" y="368.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">descriptions (Module 2)</text>
<rect x="430" y="410" width="270" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="565.0" y="450.0" font-size="28" text-anchor="middle">🐍</text>
<text x="565.0" y="473.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Code execution</text>
<text x="565.0" y="493.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">model writes a script;</text><text x="565.0" y="508.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">results stay in the sandbox</text>
<rect x="780" y="130" width="260" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="910.0" y="170.0" font-size="28" text-anchor="middle">📘</text>
<text x="910.0" y="193.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Agent skills</text>
<text x="910.0" y="213.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">short description always;</text><text x="910.0" y="228.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">full SKILL.md on demand</text>
<rect x="780" y="270" width="260" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="910.0" y="310.0" font-size="28" text-anchor="middle">👥</text>
<text x="910.0" y="333.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Subagents</text>
<text x="910.0" y="353.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">each with a</text><text x="910.0" y="368.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">small toolset</text>
<rect x="780" y="410" width="260" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="910.0" y="450.0" font-size="28" text-anchor="middle">📦</text>
<text x="910.0" y="473.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Sandbox</text>
<text x="910.0" y="493.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">no network, limits,</text><text x="910.0" y="508.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">no secrets inside</text>
<text x="550" y="578.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Measure first: tokens, look-alike pairs, then an agent eval</text>
</svg>
<rect x="554.0" y="234.5" width="92.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="600.0" y="248.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">task matches</text>
<path d="M600.0,385.0 L600.0,440.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="536.5" y="389.5" width="127.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="600.0" y="403.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">step needs a file</text>
<rect x="60" y="130" width="270" height="100" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="195.0" y="165.0" font-size="28" text-anchor="middle">🏷️</text>
<text x="195.0" y="188.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">SKILL.md frontmatter</text>
<text x="195.0" y="208.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">name + description</text><text x="195.0" y="223.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(what + when)</text>
<rect x="60" y="285" width="270" height="100" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="195.0" y="320.0" font-size="28" text-anchor="middle">📝</text>
<text x="195.0" y="343.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">SKILL.md body</text>
<text x="195.0" y="363.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">steps, rules, format,</text><text x="195.0" y="378.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">pointers to files</text>
<rect x="60" y="440" width="270" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="195.0" y="472.0" font-size="28" text-anchor="middle">🗂️</text>
<text x="195.0" y="495.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Optional files</text>
<text x="195.0" y="515.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">scripts/  run, not read</text><text x="195.0" y="530.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">references/  read if needed</text><text x="195.0" y="546.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">assets/  templates</text>
<rect x="430" y="130" width="340" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="600.0" y="173.0" font-size="28" text-anchor="middle">1️⃣</text>
<text x="600.0" y="196.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Always: catalog</text>
<text x="600.0" y="216.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">~50-100 tokens per skill</text>
<rect x="430" y="285" width="340" height="100" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="600.0" y="328.0" font-size="28" text-anchor="middle">2️⃣</text>
<text x="600.0" y="351.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">On match: instructions</text>
<text x="600.0" y="371.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">under ~5,000 tokens</text>
<rect x="430" y="440" width="340" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="600.0" y="480.0" font-size="28" text-anchor="middle">3️⃣</text>
<text x="600.0" y="503.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">On demand: resources</text>
<text x="600.0" y="523.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">only the file a step needs;</text><text x="600.0" y="538.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">script output, not source</text>
<rect x="865" y="130" width="180" height="420" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="955.0" y="285.0" font-size="28" text-anchor="middle">🤝</text>
<text x="955.0" y="308.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Many agents</text>
<text x="955.0" y="328.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Claude Code</text><text x="955.0" y="343.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Claude API</text><text x="955.0" y="359.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Codex</text><text x="955.0" y="374.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Gemini CLI</text><text x="955.0" y="390.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Copilot / VS Code</text><text x="955.0" y="406.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Cursor</text><text x="955.0" y="421.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">...</text>
<text x="550" y="625.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Open standard (agentskills.io): write once, use in any compatible agent</text>
</svg>
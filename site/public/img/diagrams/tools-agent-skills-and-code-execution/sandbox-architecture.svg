<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Running agent code safely: brain outside, hands in a sandbox">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="638" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#1f766d"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Running agent code safely: brain outside, hands in a sandbox</text>
<rect x="30" y="90" width="330" height="470" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="114.9" y="75" width="160.2" height="30" rx="15" fill="#5b3fa0"/>
<text x="195.0" y="95.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Harness (trusted)</text>
<rect x="410" y="90" width="330" height="470" rx="14" fill="none" stroke="#ec9a8a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="464.8" y="75" width="220.39999999999998" height="30" rx="15" fill="#b2442f"/>
<text x="575.0" y="95.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Sandbox (untrusted code)</text>
<rect x="790" y="90" width="280" height="470" rx="14" fill="none" stroke="#b8bec6" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="867.1" y="75" width="125.8" height="30" rx="15" fill="#4b5563"/>
<text x="930.0" y="95.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Outside world</text>
<path d="M330.0,175.0 L440.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="353.0" y="152.0" width="64.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="385.0" y="166.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">run this</text>
<path d="M575.0,220.0 L575.0,235.0 L385.0,235.0 L385.0,445.0 L330.0,445.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="349.5" y="317.0" width="71.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="385.0" y="331.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">tool call</text>
<path d="M710.0,175.0 L815.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="734.0" y="152.0" width="57.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="762.5" y="166.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">network</text>
<path d="M930.0,230.0 L930.0,300.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M195.0,340.0 L195.0,370.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="60" y="130" width="270" height="90" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="195.0" y="168.0" font-size="28" text-anchor="middle">🧠</text>
<text x="195.0" y="191.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model + agent loop</text>
<text x="195.0" y="211.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">writes code, reads output</text>
<rect x="60" y="250" width="270" height="90" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="195.0" y="288.0" font-size="28" text-anchor="middle">🔑</text>
<text x="195.0" y="311.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Credentials stay here</text>
<text x="195.0" y="331.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">API keys, tokens, DB passwords</text>
<rect x="60" y="370" width="270" height="150" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="195.0" y="422.0" font-size="28" text-anchor="middle">🌉</text>
<text x="195.0" y="445.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Tool bridge</text>
<text x="195.0" y="465.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">runs tool calls the code asks</text><text x="195.0" y="480.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">for; checks permissions,</text><text x="195.0" y="496.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">validates, logs, rate-limits</text>
<rect x="440" y="130" width="270" height="90" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="575.0" y="168.0" font-size="28" text-anchor="middle">🐍</text>
<text x="575.0" y="191.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model-written code</text>
<text x="575.0" y="211.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">python / bash</text>
<rect x="440" y="250" width="270" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="575.0" y="290.0" font-size="28" text-anchor="middle">⏱️</text>
<text x="575.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Limits</text>
<text x="575.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">CPU, memory, disk, processes,</text><text x="575.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">wall-clock timeout</text>
<rect x="440" y="390" width="270" height="130" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="575.0" y="432.0" font-size="28" text-anchor="middle">📁</text>
<text x="575.0" y="455.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Scratch workspace</text>
<text x="575.0" y="475.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">only mounted files;</text><text x="575.0" y="490.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">no home dir, no host secrets;</text><text x="575.0" y="506.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thrown away after</text>
<rect x="815" y="120" width="230" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="930.0" y="160.0" font-size="28" text-anchor="middle">🚦</text>
<text x="930.0" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Egress proxy</text>
<text x="930.0" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">allowlist: pypi.org,</text><text x="930.0" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">api.github.com; else deny</text>
<rect x="815" y="300" width="230" height="100" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="930.0" y="335.0" font-size="28" text-anchor="middle">🌐</text>
<text x="930.0" y="358.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Internet / APIs</text>
<text x="930.0" y="378.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reached only via proxy</text><text x="930.0" y="393.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">or via the bridge</text>
<text x="550" y="600.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Isolation strength: process &lt; OS sandbox &lt; container &lt; gVisor &lt; microVM &lt; VM</text>
</svg>
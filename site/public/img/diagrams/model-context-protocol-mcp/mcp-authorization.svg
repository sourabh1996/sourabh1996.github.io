<text x="400.0" y="313.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in Claude, VS Code,</text><text x="400.0" y="328.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">your agent</text>

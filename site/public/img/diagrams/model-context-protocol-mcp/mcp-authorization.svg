<text x="985.0" y="148.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Every request</text>
<text x="985.0" y="168.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">signature, issuer,</text><text x="985.0" y="183.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">expiry, audience, scope</text>
<rect x="900" y="380" width="170" height="120" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="985.0" y="425.0" font-size="28" text-anchor="middle">🔐</text>
<text x="985.0" y="448.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Login safety</text>
<text x="985.0" y="468.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">PKCE S256, resource,</text><text x="985.0" y="483.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">state, iss</text>
<text x="550" y="560.0" font-size="14" font-weight="600" fill="#9a5b00" text-anchor="middle">The MCP server never sees passwords. It names its authorization server and checks the tokens clients bring.</text>

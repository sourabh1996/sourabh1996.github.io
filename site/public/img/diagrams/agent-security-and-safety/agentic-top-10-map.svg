<text x="215.0" y="169.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI01 Goal hijack</text>
<text x="215.0" y="189.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">outside text redirects its goal</text>
<rect x="395" y="130" width="310" height="84" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="169.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI06 Memory poisoning</text>
<text x="550.0" y="189.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">bad facts saved for later</text>
<rect x="730" y="130" width="310" height="84" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="885.0" y="169.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI07 Inter-agent comms</text>
<text x="885.0" y="189.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">spoofed or tampered messages</text>
<rect x="60" y="310" width="310" height="84" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="215.0" y="349.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI03 Identity and privilege</text>
<text x="215.0" y="369.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">borrowed, broad, long-lived keys</text>
<rect x="395" y="310" width="310" height="84" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="550.0" y="349.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI04 Supply chain</text>
<text x="550.0" y="369.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">MCP servers, skills, packages</text>
<rect x="730" y="310" width="310" height="84" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="885.0" y="349.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI10 Rogue agents</text>
<text x="885.0" y="369.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acting outside policy, unseen</text>
<rect x="60" y="490" width="230" height="84" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="175.0" y="529.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI02 Tool misuse</text>
<text x="175.0" y="549.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">right tool, wrong outcome</text>
<rect x="315" y="490" width="230" height="84" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="430.0" y="529.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI05 Code execution</text>
<text x="430.0" y="549.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">words become running code</text>
<rect x="570" y="490" width="230" height="84" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="685.0" y="529.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI08 Cascading failures</text>
<text x="685.0" y="549.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">one error spreads</text>
<rect x="825" y="490" width="215" height="84" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="932.5" y="529.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ASI09 Trust exploitation</text>
<text x="932.5" y="549.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">humans approve bad acts</text>
<rect x="250" y="600" width="600" height="62" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="636.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">🧭 Least agency: only the autonomy, tools and access the task needs</text>

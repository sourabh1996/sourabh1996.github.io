<text x="550.0" y="702.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">🔑 Credentials the tools carry</text>
<text x="550.0" y="722.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the agent acts with THEIR authority</text>

<text x="550.0" y="345.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reads it all as one text</text><text x="550.0" y="360.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cannot tell who wrote</text><text x="550.0" y="376.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">which line</text>

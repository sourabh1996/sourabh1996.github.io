<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="A reliable extraction pipeline">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="758" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">A reliable extraction pipeline</text>
<rect x="470" y="110" width="300" height="470" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="518.4" y="95" width="203.2" height="30" rx="15" fill="#5b3fa0"/>
<text x="620.0" y="115.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Three layers of checks</text>
<path d="M130.0,250.0 L130.0,300.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M220.0,365.0 L260.0,365.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M345.0,300.0 L345.0,250.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M430.0,190.0 L500.0,202.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M740.0,202.5 L850.0,190.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="768.0" y="161.0" width="64.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="800" y="175.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">all pass</text>
<path d="M740.0,342.5 L850.0,375.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="782.0" y="331.0" width="36.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="800" y="345.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">fail</text>
<path d="M740.0,487.5 L800.0,487.0 L800.0,560.0 L850.0,560.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="761.0" y="511.0" width="78.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="800" y="525.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">fail twice</text>
<path d="M1060.0,375.0 L1080.0,375.0 L1080.0,655.0 L345.0,655.0 L345.0,430.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="516.5" y="626.0" width="127.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="580" y="640.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">retry with errors</text>
<rect x="40" y="130" width="180" height="120" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="130.0" y="175.0" font-size="28" text-anchor="middle">📩</text>
<text x="130.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Raw SMS</text>
<text x="130.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Rs.450.00 debited</text><text x="130.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">from A/c XX4821...&quot;</text>
<rect x="40" y="300" width="180" height="130" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="130.0" y="342.0" font-size="28" text-anchor="middle">📝</text>
<text x="130.0" y="365.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Prompt</text>
<text x="130.0" y="385.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">system rules</text><text x="130.0" y="400.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ schema + example</text><text x="130.0" y="416.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ SMS in &lt;sms&gt; tags</text>
<rect x="260" y="300" width="170" height="130" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="345.0" y="358.0" font-size="28" text-anchor="middle">🤖</text>
<text x="345.0" y="381.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">LLM</text>
<text x="345.0" y="401.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">proposes JSON</text>
<rect x="260" y="130" width="170" height="120" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="345.0" y="175.0" font-size="28" text-anchor="middle">🧹</text>
<text x="345.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Parse</text>
<text x="345.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">strip ```fences</text><text x="345.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and preambles</text>
<rect x="500" y="145" width="240" height="115" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="620.0" y="187.5" font-size="28" text-anchor="middle">📐</text>
<text x="620.0" y="210.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Schema</text>
<text x="620.0" y="230.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">types, enums, required</text><text x="620.0" y="246.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(Pydantic)</text>
<rect x="500" y="285" width="240" height="115" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="620.0" y="327.5" font-size="28" text-anchor="middle">📏</text>
<text x="620.0" y="350.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Business rules</text>
<text x="620.0" y="370.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">₹0 &lt; amount ≤ ₹10 lakh,</text><text x="620.0" y="386.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">12-digit ref, no future date</text>
<rect x="500" y="425" width="240" height="125" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="620.0" y="464.5" font-size="28" text-anchor="middle">🔍</text>
<text x="620.0" y="487.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Grounding</text>
<text x="620.0" y="507.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">is each amount, ref and</text><text x="620.0" y="523.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">account number really</text><text x="620.0" y="538.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in the SMS?</text>
<rect x="850" y="130" width="210" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="955.0" y="183.0" font-size="28" text-anchor="middle">✅</text>
<text x="955.0" y="206.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Clean record</text>
<text x="955.0" y="226.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">saved to the database</text>
<rect x="850" y="300" width="210" height="150" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="955.0" y="344.0" font-size="28" text-anchor="middle">🔧</text>
<text x="955.0" y="367.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Repair message</text>
<text x="955.0" y="387.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;upi_ref 630012457789</text><text x="955.0" y="402.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">does not appear in</text><text x="955.0" y="418.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the SMS. Reply with</text><text x="955.0" y="433.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">corrected JSON.&quot;</text>
<rect x="850" y="500" width="210" height="120" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="955.0" y="545.0" font-size="28" text-anchor="middle">🧑‍💻</text>
<text x="955.0" y="568.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Human review</text>
<text x="955.0" y="588.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">after 2 failed attempts,</text><text x="955.0" y="603.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">with error history</text>
<text x="550" y="705.0" font-size="15" font-weight="700" fill="#5b3fa0" text-anchor="middle">The model is allowed to be wrong; the pipeline is not allowed to pass it on.</text>
<text x="550" y="732.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Constrained decoding removes shape errors; grounding, rules and review still catch wrong values.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Inside an LLM: from your words to the next token">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="798" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Inside an LLM: from your words to the next token</text>
<rect x="40" y="265" width="1020" height="235" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="465.6" y="250" width="168.79999999999998" height="30" rx="15" fill="#5b3fa0"/>
<text x="550.0" y="270.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Transformer blocks</text>
<path d="M240.0,150.0 L300.0,150.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M500.0,150.0 L560.0,150.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M760.0,150.0 L820.0,150.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M940.0,205.0 L940.0,235.0 L230.0,235.0 L230.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="546.0" y="224.0" width="78.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="585" y="238.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">vectors in</text>
<path d="M370.0,387.5 L420.0,387.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M700.0,387.5 L790.0,387.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="709.5" y="351.0" width="71.0" height="36" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="745" y="365.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">× dozens</text><text x="745" y="382.6" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">of blocks</text>
<path d="M910.0,470.0 L910.0,585.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M800.0,645.0 L755.0,645.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M545.0,645.0 L500.0,645.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M290.0,645.0 L250.0,645.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M40.0,645.0 L22.0,645.0 L22.0,150.0 L40.0,150.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="46.5" y="526.0" width="127.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="110" y="540.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">repeat until done</text>
<rect x="40" y="95" width="200" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="140.0" y="135.0" font-size="28" text-anchor="middle">💬</text>
<text x="140.0" y="158.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Your text</text>
<text x="140.0" y="178.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Ek cutting chai</text><text x="140.0" y="193.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and one&quot;</text>
<rect x="300" y="95" width="200" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="400.0" y="135.0" font-size="28" text-anchor="middle">✂️</text>
<text x="400.0" y="158.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Tokenizer</text>
<text x="400.0" y="178.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">splits text into</text><text x="400.0" y="193.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">common pieces</text>
<rect x="560" y="95" width="200" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="660.0" y="135.0" font-size="28" text-anchor="middle">🔢</text>
<text x="660.0" y="158.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Token IDs</text>
<text x="660.0" y="178.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">[36, 2081, 9437,</text><text x="660.0" y="193.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">1081, 323, 832]</text>
<rect x="820" y="95" width="240" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="940.0" y="127.0" font-size="28" text-anchor="middle">📍</text>
<text x="940.0" y="150.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Embeddings</text>
<text x="940.0" y="170.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">each ID becomes a vector</text><text x="940.0" y="185.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">of thousands of numbers</text><text x="940.0" y="201.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">+ its position</text>
<rect x="90" y="305" width="280" height="165" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="230.0" y="356.5" font-size="28" text-anchor="middle">👀</text>
<text x="230.0" y="379.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Attention</text>
<text x="230.0" y="399.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every token looks back at</text><text x="230.0" y="415.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the earlier tokens and pulls in</text><text x="230.0" y="430.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">what matters (&quot;one&quot; checks</text><text x="230.0" y="446.4" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">what is being counted)</text>
<rect x="420" y="305" width="280" height="165" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="560.0" y="364.5" font-size="28" text-anchor="middle">📚</text>
<text x="560.0" y="387.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Feed-forward layer</text>
<text x="560.0" y="407.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">applies patterns stored</text><text x="560.0" y="423.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in the weights to each</text><text x="560.0" y="438.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">token&#x27;s vector</text>
<rect x="790" y="305" width="240" height="165" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="910.0" y="364.5" font-size="28" text-anchor="middle">🧭</text>
<text x="910.0" y="387.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Final vector</text>
<text x="910.0" y="407.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">for the last position:</text><text x="910.0" y="423.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a summary of &quot;what</text><text x="910.0" y="438.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">should come next&quot;</text>
<rect x="40" y="585" width="210" height="120" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="145.0" y="630.0" font-size="28" text-anchor="middle">➕</text>
<text x="145.0" y="653.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Next token</text>
<text x="145.0" y="673.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;samosa&quot;</text><text x="145.0" y="688.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">appended to the text</text>
<rect x="290" y="585" width="210" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="395.0" y="630.0" font-size="28" text-anchor="middle">🎲</text>
<text x="395.0" y="653.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Sampler</text>
<text x="395.0" y="673.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">temperature, top-p</text><text x="395.0" y="688.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">pick one token</text>
<rect x="545" y="585" width="210" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="650.0" y="630.0" font-size="28" text-anchor="middle">📊</text>
<text x="650.0" y="653.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Probabilities</text>
<text x="650.0" y="673.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">softmax of the scores:</text><text x="650.0" y="688.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">samosa 36% · vada 24% · ...</text>
<rect x="800" y="585" width="220" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="910.0" y="630.0" font-size="28" text-anchor="middle">🎯</text>
<text x="910.0" y="653.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Scores (logits)</text>
<text x="910.0" y="673.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">one score for every</text><text x="910.0" y="688.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">token in the vocabulary</text>
<text x="550" y="750.0" font-size="15" font-weight="700" fill="#2f5fb3" text-anchor="middle">One pass through this pipeline produces exactly one token. A 300-token reply means 300 passes.</text>
<text x="550" y="775.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">The weights (billions of numbers) are fixed after training; only the text changes between passes.</text>
</svg>
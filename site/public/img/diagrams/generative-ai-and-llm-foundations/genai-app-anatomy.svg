<text x="327.5" y="275.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Backend</text>
<text x="327.5" y="295.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">who is the user?</text><text x="327.5" y="310.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">what may they see?</text><text x="327.5" y="326.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">build the prompt</text>

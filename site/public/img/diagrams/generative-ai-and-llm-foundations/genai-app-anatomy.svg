<text x="552.5" y="283.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Foundation model</text>
<text x="552.5" y="303.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">API or</text><text x="552.5" y="318.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">self-hosted</text>
<rect x="690" y="210" width="150" height="130" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="765.0" y="260.0" font-size="28" text-anchor="middle">🛡️</text>
<text x="765.0" y="283.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Checks</text>
<text x="765.0" y="303.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">schema, business</text><text x="765.0" y="318.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">rules, safety</text>
<rect x="690" y="375" width="150" height="110" rx="12" fill="#fbe9f2" stroke="#e597bd" stroke-width="2"/>
<text x="765.0" y="415.0" font-size="28" text-anchor="middle">🧑‍💼</text>
<text x="765.0" y="438.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Human review</text>
<text x="765.0" y="458.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">risky or unsure</text><text x="765.0" y="473.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cases</text>
<rect x="915" y="200" width="165" height="150" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="997.5" y="252.0" font-size="28" text-anchor="middle">🏦</text>
<text x="997.5" y="275.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Answer or act</text>
<text x="997.5" y="295.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reply to user;</text><text x="997.5" y="310.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">CRM, core banking,</text><text x="997.5" y="326.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">hospital records</text>
<rect x="245" y="375" width="390" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="440.0" y="415.0" font-size="28" text-anchor="middle">📊</text>
<text x="440.0" y="438.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Logs and evaluation</text>
<text x="440.0" y="458.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every request recorded: quality,</text><text x="440.0" y="473.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cost, new failure patterns</text>
<text x="550" y="560.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">The model is one box. The boxes around it make the application safe in a real industry.</text>
<text x="550" y="595.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Industries differ in the context, the checks and who reviews, far more than in the model.</text>

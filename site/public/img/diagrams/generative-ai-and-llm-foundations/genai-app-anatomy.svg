<text x="445.0" y="181.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">policy PDFs, catalogue, customer account</text>
<rect x="470" y="210" width="165" height="130" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>

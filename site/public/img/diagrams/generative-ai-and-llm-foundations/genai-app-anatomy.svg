<text x="107.5" y="295.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">WhatsApp, app,</text><text x="107.5" y="310.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">website, phone,</text><text x="107.5" y="326.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">internal tool</text>
<rect x="245" y="210" width="165" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>

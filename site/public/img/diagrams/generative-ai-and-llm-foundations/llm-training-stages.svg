<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 930" width="1100" height="930" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="How an LLM is trained: four stages">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="928" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2e7d4f"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">How an LLM is trained: four stages</text>
<rect x="20" y="80" width="1060" height="190" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="90" width="110" height="170" rx="10" fill="#2f5fb3"/>
<text x="85.0" y="171.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 1</text><text x="85.0" y="198.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Pretrain</text>
<rect x="20" y="285" width="1060" height="175" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="295" width="110" height="155" rx="10" fill="#1f766d"/>
<text x="85.0" y="368.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 2</text><text x="85.0" y="396.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">SFT</text>
<rect x="20" y="475" width="1060" height="235" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="485" width="110" height="215" rx="10" fill="#5b3fa0"/>
<text x="85.0" y="576.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 3</text><text x="85.0" y="604.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">RLHF /</text><text x="85.0" y="631.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">RLAIF</text>
<rect x="20" y="725" width="1060" height="190" rx="14" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="735" width="110" height="170" rx="10" fill="#b2442f"/>
<text x="85.0" y="816.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Stage 4</text><text x="85.0" y="843.5" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">RLVR</text>
<path d="M390.0,175.0 L440.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M690.0,175.0 L740.0,175.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M390.0,372.5 L440.0,372.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M690.0,372.5 L740.0,372.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M390.0,592.5 L440.0,537.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M565.0,580.0 L565.0,605.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M690.0,647.5 L740.0,592.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M390.0,820.0 L440.0,820.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M690.0,820.0 L740.0,820.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M900.0,245.0 L900.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="912.0" y="266.0" width="106.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="965" y="280.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">starting point</text>
<path d="M900.0,440.0 L900.0,495.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="912.0" y="456.0" width="106.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="965" y="470.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">starting point</text>
<path d="M900.0,690.0 L900.0,750.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="912.0" y="706.0" width="106.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="965" y="720.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">starting point</text>
<rect x="160" y="105" width="230" height="140" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="275.0" y="152.0" font-size="28" text-anchor="middle">🌐</text>
<text x="275.0" y="175.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Huge raw text</text>
<text x="275.0" y="195.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">web pages, books, code,</text><text x="275.0" y="210.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">papers: trillions of tokens</text><text x="275.0" y="226.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(filtered and cleaned)</text>
<rect x="440" y="105" width="250" height="140" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="565.0" y="144.0" font-size="28" text-anchor="middle">🔮</text>
<text x="565.0" y="167.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Predict the next token</text>
<text x="565.0" y="187.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;ek cutting ___&quot;</text><text x="565.0" y="202.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">loss = surprise at the real</text><text x="565.0" y="218.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">next token; months on</text><text x="565.0" y="233.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">huge GPU clusters</text>
<rect x="740" y="105" width="320" height="140" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="900.0" y="144.0" font-size="28" text-anchor="middle">📖</text>
<text x="900.0" y="167.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Base model</text>
<text x="900.0" y="187.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">knows language, facts, code</text><text x="900.0" y="202.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">but only continues text:</text><text x="900.0" y="218.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">asked a question, it may</text><text x="900.0" y="233.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">write more questions</text>
<rect x="160" y="305" width="230" height="135" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="275.0" y="349.5" font-size="28" text-anchor="middle">✍️</text>
<text x="275.0" y="372.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Ideal answers</text>
<text x="275.0" y="392.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thousands to millions of</text><text x="275.0" y="408.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">instruction → ideal reply</text><text x="275.0" y="423.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">examples, by experts</text>
<rect x="440" y="305" width="250" height="135" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="565.0" y="357.5" font-size="28" text-anchor="middle">🎓</text>
<text x="565.0" y="380.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Supervised fine-tuning</text>
<text x="565.0" y="400.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">same next-token loss,</text><text x="565.0" y="416.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">but only on the replies</text>
<rect x="740" y="305" width="320" height="135" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="900.0" y="357.5" font-size="28" text-anchor="middle">💬</text>
<text x="900.0" y="380.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Instruction-following model</text>
<text x="900.0" y="400.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">answers in the assistant</text><text x="900.0" y="416.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">format, follows requests</text>
<rect x="160" y="495" width="230" height="195" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="275.0" y="545.5" font-size="28" text-anchor="middle">⚖️</text>
<text x="275.0" y="568.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Which reply is better?</text>
<text x="275.0" y="588.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">two answers to one prompt;</text><text x="275.0" y="604.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a judge picks the better</text><text x="275.0" y="619.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="275.0" y="635.4" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RLHF: human judges</text><text x="275.0" y="651.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">RLAIF: an AI judge guided</text><text x="275.0" y="666.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">by written principles</text>
<rect x="440" y="495" width="250" height="85" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="565.0" y="530.5" font-size="28" text-anchor="middle">🏅</text>
<text x="565.0" y="553.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Reward model</text>
<text x="565.0" y="573.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">learns to score replies</text>
<rect x="440" y="605" width="250" height="85" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="565.0" y="648.5" font-size="28" text-anchor="middle">🔁</text>
<text x="565.0" y="671.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">RL: write, get scored, adjust</text>
<rect x="740" y="495" width="320" height="195" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="900.0" y="545.5" font-size="28" text-anchor="middle">🤝</text>
<text x="900.0" y="568.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Assistant model</text>
<text x="900.0" y="588.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">more helpful, more honest,</text><text x="900.0" y="604.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">refuses harmful requests</text><text x="900.0" y="619.8" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle"></text><text x="900.0" y="635.4" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">(DPO skips the reward model</text><text x="900.0" y="651.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and learns from the pairs</text><text x="900.0" y="666.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">directly)</text>
<rect x="160" y="750" width="230" height="140" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="275.0" y="797.0" font-size="28" text-anchor="middle">🧮</text>
<text x="275.0" y="820.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Checkable problems</text>
<text x="275.0" y="840.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">maths with known answers,</text><text x="275.0" y="855.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">code with unit tests,</text><text x="275.0" y="871.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">logic puzzles</text>
<rect x="440" y="750" width="250" height="140" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="565.0" y="789.0" font-size="28" text-anchor="middle">🧠</text>
<text x="565.0" y="812.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Think, answer, verify</text>
<text x="565.0" y="832.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">reward when the final</text><text x="565.0" y="847.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">answer is checked correct;</text><text x="565.0" y="863.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">longer useful thinking</text><text x="565.0" y="878.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">gets reinforced</text>
<rect x="740" y="750" width="320" height="140" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="900.0" y="797.0" font-size="28" text-anchor="middle">💡</text>
<text x="900.0" y="820.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Reasoning model</text>
<text x="900.0" y="840.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thinks step by step before</text><text x="900.0" y="855.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">answering; spend more</text><text x="900.0" y="871.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thinking for harder problems</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Just-in-time context: a small window, fed on demand">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="698" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#1f766d"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Just-in-time context: a small window, fed on demand</text>
<rect x="380" y="210" width="340" height="300" rx="14" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="431.2" y="195" width="237.6" height="30" rx="15" fill="#2f5fb3"/>
<text x="550.0" y="215.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">The agent&#x27;s working window</text>
<path d="M320.0,165.0 L350.0,165.0 L350.0,319.0 L405.0,319.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M320.0,315.0 L360.0,315.0 L360.0,375.0 L405.0,375.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M320.0,465.0 L405.0,431.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M695.0,319.0 L750.0,319.0 L750.0,165.0 L780.0,165.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M780.0,315.0 L740.0,315.0 L740.0,375.0 L695.0,375.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M780.0,465.0 L740.0,465.0 L740.0,482.0 L695.0,482.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="405" y="240" width="290" height="46" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="268.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">📜 Instructions + memory file</text>
<rect x="405" y="296" width="290" height="46" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="324.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">🗒️ Current plan / to-do</text>
<rect x="405" y="352" width="290" height="46" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="380.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">💬 Recent turns, verbatim</text>
<rect x="405" y="408" width="290" height="46" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="436.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">🧾 Summary of older turns</text>
<rect x="405" y="464" width="290" height="36" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="487.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">🔗 Paths and IDs, not contents</text>
<rect x="40" y="110" width="280" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="180.0" y="150.0" font-size="28" text-anchor="middle">🔎</text>
<text x="180.0" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">SELECT just in time</text>
<text x="180.0" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">list, grep, read line ranges,</text><text x="180.0" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">search tools, retrieval</text>
<rect x="40" y="260" width="280" height="110" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="180.0" y="300.0" font-size="28" text-anchor="middle">✂️</text>
<text x="180.0" y="323.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">SHAPE tool results</text>
<text x="180.0" y="343.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">filters, fields, pages,</text><text x="180.0" y="358.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">caps with guidance</text>
<rect x="40" y="410" width="280" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="180.0" y="450.0" font-size="28" text-anchor="middle">🗜️</text>
<text x="180.0" y="473.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">COMPRESS history</text>
<text x="180.0" y="493.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">clear used results,</text><text x="180.0" y="508.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">summarise, compact</text>
<rect x="780" y="110" width="280" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="920.0" y="150.0" font-size="28" text-anchor="middle">📁</text>
<text x="920.0" y="173.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">WRITE it down</text>
<text x="920.0" y="193.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">notes, progress file,</text><text x="920.0" y="208.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">big results saved to disk</text>
<rect x="780" y="260" width="280" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="920.0" y="300.0" font-size="28" text-anchor="middle">🧑‍🤝‍🧑</text>
<text x="920.0" y="323.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">ISOLATE heavy reading</text>
<text x="920.0" y="343.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">sub-agent explores in its own</text><text x="920.0" y="358.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">window, returns ~1-2K tokens</text>
<rect x="780" y="410" width="280" height="110" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="920.0" y="450.0" font-size="28" text-anchor="middle">🗄️</text>
<text x="920.0" y="473.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Outside the window</text>
<text x="920.0" y="493.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">files, memory store, docs,</text><text x="920.0" y="508.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">codebase, web, databases</text>
<text x="550" y="560.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">The window holds what the next step needs. Everything else lives outside it,</text>
<text x="550" y="586.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">reachable by a path, an ID or a search, and is loaded only when it earns its place.</text>
<text x="550" y="630.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Write, select, compress and isolate: four moves that keep a 200-step run inside a fixed budget.</text>
</svg>
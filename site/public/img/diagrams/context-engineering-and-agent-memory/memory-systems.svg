<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Agent memory: what stays in the thread, what outlives it">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="698" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Agent memory: what stays in the thread, what outlives it</text>
<rect x="30" y="100" width="300" height="420" rx="14" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="99.9" y="85" width="160.2" height="30" rx="15" fill="#2f5fb3"/>
<text x="180.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Short-term memory</text>
<rect x="400" y="100" width="300" height="420" rx="14" fill="none" stroke="#b8bec6" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="435.5" y="85" width="229.0" height="30" rx="15" fill="#4b5563"/>
<text x="550.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Context window (one call)</text>
<rect x="770" y="100" width="300" height="420" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="844.2" y="85" width="151.6" height="30" rx="15" fill="#5b3fa0"/>
<text x="920.0" y="105.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Long-term memory</text>
<path d="M180.0,240.0 L180.0,270.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180.0,370.0 L180.0,400.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M305.0,320.0 L365.0,320.0 L365.0,296.0 L425.0,296.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="322.5" y="285.0" width="85.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="365.0" y="299.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">load thread</text>
<path d="M795.0,187.5 L735.0,187.0 L735.0,231.0 L675.0,231.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="710.0" y="186.0" width="50.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="735.0" y="200.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">search</text>
<path d="M675.0,455.0 L735.0,455.0 L735.0,302.0 L795.0,302.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="713.5" y="355.5" width="43.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="735.0" y="369.5" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">write</text>
<rect x="55" y="140" width="250" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="180.0" y="175.0" font-size="28" text-anchor="middle">🧵</text>
<text x="180.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Thread state</text>
<text x="180.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">messages, tool results,</text><text x="180.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">plan, scratchpad</text>
<rect x="55" y="270" width="250" height="100" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="180.0" y="305.0" font-size="28" text-anchor="middle">💾</text>
<text x="180.0" y="328.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Checkpointer</text>
<text x="180.0" y="348.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">saves the thread after</text><text x="180.0" y="363.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every step (thread_id)</text>
<rect x="55" y="400" width="250" height="95" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="180.0" y="432.5" font-size="28" text-anchor="middle">⏳</text>
<text x="180.0" y="455.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Ends with the thread</text>
<text x="180.0" y="475.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">compacted when long,</text><text x="180.0" y="491.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">gone in a new chat</text>
<rect x="425" y="140" width="250" height="52" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="171.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">📜 Instructions + memory files</text>
<rect x="425" y="205" width="250" height="52" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="550.0" y="236.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">🧠 Retrieved memories</text>
<rect x="425" y="270" width="250" height="52" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="301.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">💬 This thread&#x27;s messages</text>
<rect x="425" y="335" width="250" height="52" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="366.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">✉️ The new message</text>
<rect x="425" y="415" width="250" height="80" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="550.0" y="448.0" font-size="28" text-anchor="middle">🤖</text>
<text x="550.0" y="471.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model replies</text>
<text x="550.0" y="491.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and may decide to remember</text>
<rect x="795" y="140" width="250" height="95" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="920.0" y="172.5" font-size="28" text-anchor="middle">📇</text>
<text x="920.0" y="195.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Semantic</text>
<text x="920.0" y="215.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">facts: &#x27;mother needs</text><text x="920.0" y="231.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a lower berth&#x27;</text>
<rect x="795" y="255" width="250" height="95" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="920.0" y="287.5" font-size="28" text-anchor="middle">🎞️</text>
<text x="920.0" y="310.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Episodic</text>
<text x="920.0" y="330.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">past episodes: &#x27;last refund</text><text x="920.0" y="346.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">case went like this&#x27;</text>
<rect x="795" y="370" width="250" height="95" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="920.0" y="402.5" font-size="28" text-anchor="middle">🛠️</text>
<text x="920.0" y="425.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Procedural</text>
<text x="920.0" y="445.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">how to work: loaded with</text><text x="920.0" y="461.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the instructions</text>
<text x="550" y="565.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Memory is text your code saves and later puts back into the window.</text>
<text x="550" y="593.0" font-size="14" font-weight="500" fill="#57606a" text-anchor="middle">The model&#x27;s weights never change: you decide what to write, what to retrieve and what to forget.</text>
<text x="550" y="640.0" font-size="15" font-weight="700" fill="#5b3fa0" text-anchor="middle">Write  →  store  →  retrieve  →  inject  →  update or forget</text>
</svg>
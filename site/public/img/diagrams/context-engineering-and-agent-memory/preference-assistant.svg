<text x="755.0" y="233.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">after the reply:</text><text x="755.0" y="248.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">write or forget</text>
<rect x="255" y="440" width="180" height="105" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>

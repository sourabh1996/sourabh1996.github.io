<text x="550.0" y="500.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Filter</text>
<text x="550.0" y="520.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">no secrets, no orders,</text><text x="550.0" y="536.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">only the user&#x27;s words</text>
<rect x="665" y="440" width="180" height="105" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="755.0" y="477.5" font-size="28" text-anchor="middle">🔁</text>
<text x="755.0" y="500.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Consolidate</text>
<text x="755.0" y="520.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">add, update with</text><text x="755.0" y="536.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">history, or skip</text>
<rect x="910" y="300" width="165" height="140" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="992.5" y="355.0" font-size="28" text-anchor="middle">🗄️</text>
<text x="992.5" y="378.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Store</text>
<text x="992.5" y="398.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">users/u-104/profile</text><text x="992.5" y="413.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">users/u-104/facts</text>
<rect x="910" y="120" width="165" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="992.5" y="160.0" font-size="28" text-anchor="middle">💾</text>
<text x="992.5" y="183.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Checkpointer</text>
<text x="992.5" y="203.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">saves each chat&#x27;s</text><text x="992.5" y="218.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">thread state</text>
<text x="550" y="610.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">The checkpointer remembers the chat; the store remembers the person.</text>
<text x="550" y="636.0" font-size="14" font-weight="500" fill="#57606a" text-anchor="middle">Forget deletes the value and its history. Memories inform; they never authorise.</text>

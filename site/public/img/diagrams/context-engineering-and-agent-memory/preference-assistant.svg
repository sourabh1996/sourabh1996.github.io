<text x="345.0" y="213.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">recall</text>
<text x="345.0" y="233.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">profile + top facts</text><text x="345.0" y="248.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">under 150 tokens</text>

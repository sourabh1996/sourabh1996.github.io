<text x="550.0" y="233.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">memory block in the</text><text x="550.0" y="248.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">system prompt</text>
<rect x="665" y="140" width="180" height="130" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>

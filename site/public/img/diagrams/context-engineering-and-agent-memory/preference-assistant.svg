<text x="345.0" y="528.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">slots and facts</text>
<rect x="460" y="440" width="180" height="105" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>

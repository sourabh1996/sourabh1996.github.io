<text x="565" y="212.0" font-size="13" font-weight="700" fill="#5b3fa0" text-anchor="middle">▲ breakpoint</text>
<text x="875" y="212.0" font-size="13" font-weight="700" fill="#5b3fa0" text-anchor="middle">▲ breakpoint</text>
<text x="145" y="240.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="start">Order is always tools → system → messages. A breakpoint caches everything before it.</text>
<text x="145" y="425.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="start">Cached reads on Claude Opus 5.5 cost $0.20 per million tokens instead of $4.00 (writes cost 1.25×).</text>
<text x="550" y="470.0" font-size="15" font-weight="700" fill="#b2442f" text-anchor="middle">Silent cache breakers: any changed byte invalidates everything after it</text>
<text x="550" y="610.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Stable first, volatile last. Append, don&#x27;t edit.</text>

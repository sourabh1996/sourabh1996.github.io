<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Five frameworks, five core ideas">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="598" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2e7d4f"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Five frameworks, five core ideas</text>
<path d="M360.0,515.0 L740.0,515.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="434.0" y="492.0" width="232.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="550.0" y="506.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">every framework offers both ends</text>
<rect x="30" y="90" width="196" height="260" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="128.0" y="189.0" font-size="28" text-anchor="middle">🧠</text>
<text x="128.0" y="212.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Deep Agents</text>
<text x="128.0" y="232.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a ready-made harness:</text><text x="128.0" y="247.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">files, subagents,</text><text x="128.0" y="263.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">summaries, skills,</text><text x="128.0" y="278.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">approvals</text>
<rect x="241" y="90" width="196" height="260" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="339.0" y="189.0" font-size="28" text-anchor="middle">👥</text>
<text x="339.0" y="212.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">CrewAI</text>
<text x="339.0" y="232.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">agents with roles</text><text x="339.0" y="247.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">do tasks as a crew;</text><text x="339.0" y="263.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">flows add code-driven</text><text x="339.0" y="278.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">steps and state</text>
<rect x="452" y="90" width="196" height="260" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="550.0" y="189.0" font-size="28" text-anchor="middle">🦙</text>
<text x="550.0" y="212.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">LlamaIndex</text>
<text x="550.0" y="232.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">steps react to</text><text x="550.0" y="247.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">typed events;</text><text x="550.0" y="263.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">agents over</text><text x="550.0" y="278.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">your documents</text>
<rect x="663" y="90" width="196" height="260" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="761.0" y="197.0" font-size="28" text-anchor="middle">🐍</text>
<text x="761.0" y="220.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">smolagents</text>
<text x="761.0" y="240.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the model writes</text><text x="761.0" y="255.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Python as its action;</text><text x="761.0" y="271.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">an executor runs it</text>
<rect x="874" y="90" width="196" height="260" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="972.0" y="179.0" font-size="28" text-anchor="middle">📘</text>
<text x="972.0" y="202.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Mastra +</text><text x="972.0" y="222.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">AI SDK</text>
<text x="972.0" y="242.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">TypeScript agents,</text><text x="972.0" y="257.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Zod-typed tools,</text><text x="972.0" y="273.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">workflows, UI</text><text x="972.0" y="288.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">streaming</text>
<rect x="30" y="370" width="196" height="60" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="128.0" y="405.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Unit: a long task</text>
<rect x="241" y="370" width="196" height="60" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="339.0" y="405.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Unit: a role</text>
<rect x="452" y="370" width="196" height="60" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="550.0" y="405.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Unit: an event</text>
<rect x="663" y="370" width="196" height="60" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="761.0" y="405.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Unit: a code snippet</text>
<rect x="874" y="370" width="196" height="60" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="972.0" y="405.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Unit: a typed step</text>
<rect x="30" y="470" width="330" height="90" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="195.0" y="508.0" font-size="28" text-anchor="middle">🎲</text>
<text x="195.0" y="531.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model decides more</text>
<text x="195.0" y="551.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Deep Agents, crews, code agents</text>
<rect x="740" y="470" width="330" height="90" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="905.0" y="508.0" font-size="28" text-anchor="middle">📏</text>
<text x="905.0" y="531.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Your code decides more</text>
<text x="905.0" y="551.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">flows, event workflows, TS workflows</text>
</svg>
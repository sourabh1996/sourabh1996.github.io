<text x="370.0" y="113.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Hosted runtimes, managed memory,</text><text x="370.0" y="130.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">provider-hosted tools</text>
<rect x="620" y="82" width="450" height="72" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="113.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Escape hatch: containers you can move;</text><text x="845.0" y="130.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">keep your own copy of data</text>
<rect x="170" y="187" width="400" height="72" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="370.0" y="218.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Sessions, checkpoints and memory</text><text x="370.0" y="235.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">in a framework&#x27;s own format</text>
<rect x="620" y="187" width="450" height="72" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="218.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Escape hatch: store plain messages</text><text x="845.0" y="235.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">and your own typed state</text>
<rect x="170" y="292" width="400" height="72" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>

<rect x="620" y="292" width="450" height="72" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="323.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Escape hatch: thin adapter around</text><text x="845.0" y="340.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">your own business logic</text>
<rect x="170" y="397" width="400" height="72" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="370.0" y="438.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Tool definitions and schemas</text>
<rect x="620" y="397" width="450" height="72" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="428.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Escape hatch: plain functions,</text><text x="845.0" y="445.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">JSON Schema, MCP servers</text>
<rect x="170" y="502" width="400" height="72" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="370.0" y="543.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Model provider and message format</text>
<rect x="620" y="502" width="450" height="72" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="845.0" y="533.0" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Escape hatch: model strings, gateways,</text><text x="845.0" y="550.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">LiteLLM-style adapters</text>
<text x="550" y="615.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Top layers are sticky (hard to move); bottom layers are already portable if you use open formats.</text>
<text x="550" y="640.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Traces: export with OpenTelemetry so observability survives a framework change.</text>

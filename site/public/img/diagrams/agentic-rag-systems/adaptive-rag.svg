<text x="455.0" y="363.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">small model or LLM</text><text x="455.0" y="378.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">picks a level</text>
<rect x="600" y="120" width="230" height="100" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="715.0" y="163.0" font-size="28" text-anchor="middle">💬</text>
<text x="715.0" y="186.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">No retrieval</text>
<text x="715.0" y="206.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;What does PNR stand for?&quot;</text>

<text x="715.0" y="351.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">One search</text>
<text x="715.0" y="371.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Fee to cancel 3 days early?&quot;</text>
<rect x="600" y="450" width="230" height="100" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="715.0" y="485.0" font-size="28" text-anchor="middle">🔁</text>
<text x="715.0" y="508.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Search, think, repeat</text>
<text x="715.0" y="528.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Train cancelled: when is</text><text x="715.0" y="543.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">my refund?&quot;</text>
<rect x="870" y="135" width="200" height="70" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="970.0" y="167.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">1 model call</text>
<text x="970.0" y="187.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">fast, cheap</text>
<rect x="870" y="300" width="200" height="70" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="970.0" y="332.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">1 search + 1 call</text>
<text x="970.0" y="352.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">the classic pipeline</text>
<rect x="870" y="465" width="200" height="70" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="970.0" y="497.0" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">2 to 4 searches + calls</text>
<text x="970.0" y="517.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">slow, but gets it right</text>
<text x="550" y="600.0" font-size="14" font-weight="500" fill="#57606a" text-anchor="middle">A fixed pipeline treats every question as Medium: it wastes effort on Easy ones and fails Hard ones.</text>
</svg>
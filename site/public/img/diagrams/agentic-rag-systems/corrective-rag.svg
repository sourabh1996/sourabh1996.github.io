<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Corrective RAG: grade the evidence, then act">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="658" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#9a6412"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Corrective RAG: grade the evidence, then act</text>
<path d="M170.0,305.0 L200.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350.0,305.0 L380.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560.0,305.0 L610.0,155.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M560.0,305.0 L610.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M560.0,305.0 L610.0,455.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M840.0,155.0 L900.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M840.0,305.0 L900.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M840.0,455.0 L900.0,305.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="30" y="260" width="140" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="100.0" y="306.0" font-size="28" text-anchor="middle">🙋</text>
<text x="100.0" y="329.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Question</text>
<rect x="200" y="260" width="150" height="90" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="275.0" y="298.0" font-size="28" text-anchor="middle">🔎</text>
<text x="275.0" y="321.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Retrieve</text>
<text x="275.0" y="341.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">top k docs</text>
<rect x="380" y="240" width="180" height="130" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="470.0" y="290.0" font-size="28" text-anchor="middle">🧪</text>
<text x="470.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Evaluator</text>
<text x="470.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">scores each doc</text><text x="470.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">0 to 1</text>
<rect x="610" y="100" width="230" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="725.0" y="140.0" font-size="28" text-anchor="middle">✅</text>
<text x="725.0" y="163.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Correct</text>
<text x="725.0" y="183.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">best doc scores high:</text><text x="725.0" y="198.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">refine it</text>
<rect x="610" y="250" width="230" height="110" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="725.0" y="290.0" font-size="28" text-anchor="middle">🤔</text>
<text x="725.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Ambiguous</text>
<text x="725.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in between:</text><text x="725.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">refine AND search the web</text>
<rect x="610" y="400" width="230" height="110" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="725.0" y="440.0" font-size="28" text-anchor="middle">❌</text>
<text x="725.0" y="463.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Incorrect</text>
<text x="725.0" y="483.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every doc scores low:</text><text x="725.0" y="498.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">discard, rewrite, web search</text>
<rect x="900" y="250" width="170" height="110" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="985.0" y="290.0" font-size="28" text-anchor="middle">✍️</text>
<text x="985.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Generate</text>
<text x="985.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">from cleaned</text><text x="985.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">evidence</text>
<rect x="380" y="550" width="460" height="90" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="610.0" y="588.0" font-size="28" text-anchor="middle">✂️</text>
<text x="610.0" y="611.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Refine: decompose, filter, recompose</text>
<text x="610.0" y="631.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">split docs into sentence strips, keep only the strips that score high</text>
<text x="960" y="590.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">Thresholds are tuned</text><text x="960" y="606.2" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">on real questions</text>
<text x="610" y="535.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">How the Correct and Ambiguous paths clean their documents:</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Agents that use human interfaces">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="698" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#1f766d"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Agents that use human interfaces</text>
<rect x="30" y="95" width="1040" height="250" rx="14" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="371.0" y="80" width="358.0" height="30" rx="15" fill="#2f5fb3"/>
<text x="550.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">What the agent perceives and how it acts</text>
<rect x="30" y="385" width="1040" height="150" rx="14" fill="none" stroke="#6cc3b8" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="439.8" y="370" width="220.39999999999998" height="30" rx="15" fill="#1f766d"/>
<text x="550.0" y="390.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">The loop all three share</text>
<rect x="30" y="570" width="1040" height="110" rx="14" fill="none" stroke="#ec9a8a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="431.2" y="555" width="237.6" height="30" rx="15" fill="#b2442f"/>
<text x="550.0" y="575.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Your harness keeps it safe</text>
<path d="M270.0,467.5 L330.0,467.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M530.0,467.5 L590.0,467.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M790.0,467.5 L850.0,467.5" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M945.0,510.0 L945.0,528.0 L170.0,528.0 L170.0,510.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="524.5" y="514.0" width="71.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="560" y="528.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">next turn</text>
<rect x="60" y="130" width="300" height="190" rx="12" fill="#e8f0fe" stroke="#7aa2f7" stroke-width="2"/>
<text x="210.0" y="194.0" font-size="28" text-anchor="middle">🌐</text>
<text x="210.0" y="217.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Browser agent</text>
<text x="210.0" y="237.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">sees: page structure,</text><text x="210.0" y="252.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">accessibility tree, screenshot</text><text x="210.0" y="268.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts: click, fill, navigate</text><text x="210.0" y="283.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Module 2</text>
<rect x="400" y="130" width="300" height="190" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="550.0" y="194.0" font-size="28" text-anchor="middle">🖥️</text>
<text x="550.0" y="217.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Computer-use agent</text>
<text x="550.0" y="237.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">sees: screenshots of a desktop</text><text x="550.0" y="252.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts: mouse and keyboard</text><text x="550.0" y="268.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">at pixel coordinates</text><text x="550.0" y="283.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Module 3</text>
<rect x="740" y="130" width="300" height="190" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="890.0" y="194.0" font-size="28" text-anchor="middle">🎙️</text>
<text x="890.0" y="217.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Voice agent</text>
<text x="890.0" y="237.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">hears: a live audio stream</text><text x="890.0" y="252.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">acts: speaks, calls tools,</text><text x="890.0" y="268.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">yields when interrupted</text><text x="890.0" y="283.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Module 4</text>
<rect x="70" y="425" width="200" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="170.0" y="460.5" font-size="28" text-anchor="middle">👀</text>
<text x="170.0" y="483.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Observe</text>
<text x="170.0" y="503.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">page, screen or speech</text>
<rect x="330" y="425" width="200" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="430.0" y="460.5" font-size="28" text-anchor="middle">🧠</text>
<text x="430.0" y="483.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Decide</text>
<text x="430.0" y="503.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">model picks one step</text>
<rect x="590" y="425" width="200" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="690.0" y="460.5" font-size="28" text-anchor="middle">🛠️</text>
<text x="690.0" y="483.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Act</text>
<text x="690.0" y="503.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">your code executes it</text>
<rect x="850" y="425" width="190" height="85" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="945.0" y="460.5" font-size="28" text-anchor="middle">✅</text>
<text x="945.0" y="483.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Verify</text>
<text x="945.0" y="503.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">did it really work?</text>
<rect x="60" y="605" width="225" height="55" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="172.5" y="637.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">📦 Isolated browser or VM</text>
<rect x="310" y="605" width="225" height="55" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="422.5" y="637.5" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">🚧 Allowlisted sites</text>
<rect x="560" y="605" width="225" height="55" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="672.5" y="637.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">🙋 Human approves risky steps</text>
<rect x="810" y="605" width="230" height="55" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="925.0" y="637.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">⚠️ Screen text is untrusted</text>
</svg>
<text x="945" y="420.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">yes</text>
<path d="M330.0,310.0 L300.0,330.0 L285.0,575.0 L260.0,575.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="254.5" y="456.0" width="57.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="283" y="470.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">handoff</text>
<rect x="40" y="150" width="220" height="95" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="150.0" y="190.5" font-size="28" text-anchor="middle">📞</text>
<text x="150.0" y="213.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Phone caller</text>
<text x="150.0" y="233.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">SIP via a telephony provider</text>
<rect x="40" y="285" width="220" height="95" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="150.0" y="325.5" font-size="28" text-anchor="middle">📱</text>
<text x="150.0" y="348.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">App or browser</text>
<text x="150.0" y="368.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">WebRTC, ephemeral token</text>
<rect x="40" y="520" width="220" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="150.0" y="560.0" font-size="28" text-anchor="middle">🧑‍💼</text>
<text x="150.0" y="583.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Human agent</text>
<text x="150.0" y="603.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">warm transfer with</text><text x="150.0" y="618.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">a summary</text>
<rect x="330" y="130" width="360" height="95" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="510.0" y="170.5" font-size="28" text-anchor="middle">👂</text>
<text x="510.0" y="193.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Turn-taking</text>
<text x="510.0" y="213.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">VAD, turn detection, barge-in, truncation</text>
<rect x="330" y="250" width="360" height="120" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="510.0" y="295.0" font-size="28" text-anchor="middle">🧠</text>
<text x="510.0" y="318.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Realtime model or cascade</text>
<text x="510.0" y="338.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">decides what to say</text><text x="510.0" y="353.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">and which tool to call</text>
<rect x="330" y="395" width="360" height="95" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="510.0" y="435.5" font-size="28" text-anchor="middle">🗣️</text>
<text x="510.0" y="458.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Fillers while tools run</text>
<text x="510.0" y="478.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">&quot;Let me check that for you&quot;</text>
<rect x="330" y="515" width="360" height="140" rx="12" fill="#fdf1dc" stroke="#e0b25c" stroke-width="2"/>
<text x="510.0" y="570.0" font-size="28" text-anchor="middle">🗒️</text>
<text x="510.0" y="593.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Transcripts, timings, consent</text>
<text x="510.0" y="613.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every turn and tool call,</text><text x="510.0" y="628.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">recorded with the caller&#x27;s consent</text>
<rect x="785" y="130" width="260" height="120" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="915.0" y="175.0" font-size="28" text-anchor="middle">🔎</text>
<text x="915.0" y="198.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Read tools</text>
<text x="915.0" y="218.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">train status, order lookup</text><text x="915.0" y="233.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">run at once, time out fast</text>
<rect x="785" y="275" width="260" height="120" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="915.0" y="320.0" font-size="28" text-anchor="middle">✋</text>
<text x="915.0" y="343.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Spoken confirmation</text>
<text x="915.0" y="363.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">read back details,</text><text x="915.0" y="378.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">code hears a clear yes</text>
<rect x="785" y="445" width="260" height="100" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="915.0" y="480.0" font-size="28" text-anchor="middle">✍️</text>
<text x="915.0" y="503.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Write tools</text>
<text x="915.0" y="523.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">cancel, refund, book</text><text x="915.0" y="538.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">idempotency keys</text>
<rect x="785" y="565" width="260" height="95" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="915.0" y="597.5" font-size="28" text-anchor="middle">🔐</text>
<text x="915.0" y="620.5" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Identity check</text>
<text x="915.0" y="640.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">OTP to registered number,</text><text x="915.0" y="656.1" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">never &#x27;trust the voice&#x27;</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="The screenshot-action loop">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="698" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#5b3fa0"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">The screenshot-action loop</text>
<rect x="30" y="95" width="330" height="560" rx="14" fill="none" stroke="#a68be0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="140.7" y="80" width="108.6" height="30" rx="15" fill="#5b3fa0"/>
<text x="195.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Model (API)</text>
<rect x="400" y="95" width="670" height="560" rx="14" fill="none" stroke="#6cc3b8" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="616.2" y="80" width="237.6" height="30" rx="15" fill="#1f766d"/>
<text x="735.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Your executor, inside a VM</text>
<path d="M710.0,180.0 L760.0,180.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M900.0,130.0 L900.0,112.0 L195.0,112.0 L195.0,260.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="493.0" y="98.0" width="134.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="560" y="112.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">screenshot (image)</text>
<path d="M195.0,450.0 L195.0,625.0 L570.0,625.0 L570.0,570.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="316.5" y="611.0" width="127.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="380" y="625.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">tool_use: actions</text>
<path d="M710.0,520.0 L760.0,520.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M900.0,470.0 L900.0,400.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M760.0,350.0 L710.0,350.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M570.0,300.0 L570.0,230.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="534.5" y="242.0" width="71.0" height="18" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="570.0" y="256.0" font-size="13" font-weight="500" fill="#57606a" text-anchor="middle">next turn</text>
<rect x="60" y="260" width="270" height="190" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="195.0" y="316.0" font-size="28" text-anchor="middle">🧠</text>
<text x="195.0" y="339.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Model</text>
<text x="195.0" y="359.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">looks at the screenshot,</text><text x="195.0" y="374.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">writes one or more actions:</text><text x="195.0" y="390.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">left_click [512, 342]</text><text x="195.0" y="405.9" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">type &quot;Chai at 5&quot;</text><text x="195.0" y="421.5" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">key ctrl+s</text>
<rect x="430" y="130" width="280" height="100" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="570.0" y="173.0" font-size="28" text-anchor="middle">📸</text>
<text x="570.0" y="196.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Capture screen</text>
<text x="570.0" y="216.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">real pixels, e.g. 2560x1600</text>
<rect x="760" y="130" width="280" height="100" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="900.0" y="173.0" font-size="28" text-anchor="middle">📐</text>
<text x="900.0" y="196.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Resize to fit limits</text>
<text x="900.0" y="216.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">remember the scale factor</text>
<rect x="430" y="470" width="280" height="100" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="570.0" y="513.0" font-size="28" text-anchor="middle">🎯</text>
<text x="570.0" y="536.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Map coordinates back</text>
<text x="570.0" y="556.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">screen = image ÷ scale</text>
<rect x="760" y="470" width="280" height="100" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="900.0" y="513.0" font-size="28" text-anchor="middle">🙋</text>
<text x="900.0" y="536.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Policy and approval</text>
<text x="900.0" y="556.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">each action, one by one</text>
<rect x="760" y="300" width="280" height="100" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="900.0" y="343.0" font-size="28" text-anchor="middle">🖱️</text>
<text x="900.0" y="366.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Move mouse, press keys</text>
<text x="900.0" y="386.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">xdotool, PyAutoGUI, Playwright</text>
<rect x="430" y="300" width="280" height="100" rx="12" fill="#e2f5f3" stroke="#6cc3b8" stroke-width="2"/>
<text x="570.0" y="343.0" font-size="28" text-anchor="middle">⏳</text>
<text x="570.0" y="366.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Let the screen settle</text>
<text x="570.0" y="386.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">then capture again</text>
</svg>
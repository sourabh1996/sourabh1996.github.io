<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three ways an agent can see a web page">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="1098" height="638" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="28" y="22" width="8" height="34" rx="4" fill="#2f5fb3"/>
<text x="48" y="48.0" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Three ways an agent can see a web page</text>
<path d="M240.0,305.0 L330.0,165.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M240.0,305.0 L330.0,325.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M240.0,305.0 L330.0,485.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M660.0,165.0 L740.0,165.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M660.0,325.0 L740.0,325.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M660.0,485.0 L740.0,485.0" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="40" y="230" width="200" height="150" rx="12" fill="#f1f3f5" stroke="#b8bec6" stroke-width="2"/>
<text x="140.0" y="290.0" font-size="28" text-anchor="middle">🌐</text>
<text x="140.0" y="313.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">The live page</text>
<text x="140.0" y="333.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">Sharma Kirana Store</text><text x="140.0" y="348.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">in Chromium</text>
<rect x="330" y="95" width="330" height="140" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="495.0" y="142.0" font-size="28" text-anchor="middle">🧾</text>
<text x="495.0" y="165.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Raw HTML / DOM</text>
<text x="495.0" y="185.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">every tag, class, script</text><text x="495.0" y="200.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">largest: often 10k to 100k+ tokens</text><text x="495.0" y="216.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">full detail, mostly noise</text>
<rect x="330" y="255" width="330" height="140" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="495.0" y="302.0" font-size="28" text-anchor="middle">🌳</text>
<text x="495.0" y="325.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Accessibility tree</text>
<text x="495.0" y="345.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">role + name of what matters</text><text x="495.0" y="360.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">small: hundreds to a few k tokens</text><text x="495.0" y="376.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">misses visual layout</text>
<rect x="330" y="415" width="330" height="140" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="495.0" y="462.0" font-size="28" text-anchor="middle">📸</text>
<text x="495.0" y="485.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Screenshot</text>
<text x="495.0" y="505.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">exactly what a person sees</text><text x="495.0" y="520.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">fixed cost: ~1.3k tokens at 1280x800</text><text x="495.0" y="536.2" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">needs coordinates to act</text>
<rect x="740" y="110" width="320" height="110" rx="12" fill="#fde8e4" stroke="#ec9a8a" stroke-width="2"/>
<text x="900.0" y="154.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Act by CSS selector</text>
<text x="900.0" y="174.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">#cart &gt; button.add</text><text x="900.0" y="189.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">breaks when markup changes</text>
<rect x="740" y="270" width="320" height="110" rx="12" fill="#e6f4ea" stroke="#7cc49a" stroke-width="2"/>
<text x="900.0" y="314.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Act by reference or role</text>
<text x="900.0" y="334.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">click e6 · button &quot;Add&quot;</text><text x="900.0" y="349.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">most reliable for forms</text>
<rect x="740" y="430" width="320" height="110" rx="12" fill="#efe9fb" stroke="#a68be0" stroke-width="2"/>
<text x="900.0" y="474.0" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Act by pixel coordinate</text>
<text x="900.0" y="494.0" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">click (246, 199)</text><text x="900.0" y="509.6" font-size="12.5" font-weight="400" fill="#57606a" text-anchor="middle">works on anything you can see</text>
<text x="550" y="600.0" font-size="15" font-weight="700" fill="#2f5fb3" text-anchor="middle">Most browser agents read the accessibility tree first and take a screenshot only when they need to see layout.</text>
</svg>